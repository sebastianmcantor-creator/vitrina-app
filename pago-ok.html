<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido confirmado — Vitrina</title>
  <link rel="stylesheet" href="lib/vitrina-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--vt-bg);
      font-family: var(--font-body);
      color: var(--vt-text-1);
    }
    .pago-ok {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-6);
      padding: var(--sp-8) var(--page-x);
      text-align: center;
    }
    .pago-ok__icon {
      font-size: 56px;
      line-height: 1;
      animation: pop .4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
    .pago-ok__title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
    }
    .pago-ok__sub {
      font-size: 15px;
      color: var(--vt-text-2);
      margin-top: -8px;
    }
    .pago-ok__badge {
      font-size: 14px;
      color: var(--vt-text-2);
      background: var(--vt-surface);
      border: 1px solid var(--vt-border);
      padding: var(--sp-3) var(--sp-5);
      border-radius: var(--r-full);
      font-weight: 600;
      letter-spacing: .03em;
    }
    .pago-ok__eta {
      width: 100%;
      max-width: 320px;
      background: var(--vt-surface);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      text-align: left;
    }
    .eta-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--vt-text-3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .eta-value { font-size: 24px; font-weight: 700; color: var(--vt-brand-light); }
    .eta-bar {
      height: 6px;
      background: var(--vt-border);
      border-radius: var(--r-full);
      overflow: hidden;
    }
    .eta-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--vt-brand), var(--vt-brand-light));
      border-radius: var(--r-full);
      width: 10%;
      transition: width .8s ease;
    }
    .eta-note { font-size: 13px; color: var(--vt-text-3); }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      background: var(--vt-success-bg);
      color: var(--vt-success);
      border: 1px solid rgba(46,204,113,.25);
      border-radius: var(--r-full);
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--vt-success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }
    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      min-height: 48px;
      background: var(--vt-surface);
      border: 1px solid var(--vt-border-strong);
      border-radius: var(--r-md);
      color: var(--vt-text-1);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background var(--dur-base);
    }
    .btn-back:hover { background: var(--vt-surface-high); }
  </style>
</head>
<body>
<main class="pago-ok" role="main">

  <div class="pago-ok__icon" aria-hidden="true">✅</div>
  <h1 class="pago-ok__title">¡Todo listo!</h1>
  <p class="pago-ok__sub">Tu pedido fue enviado a cocina</p>

  <p class="pago-ok__badge" role="status" id="order-badge">
    Pedido&nbsp;<strong>#<span id="order-num">—</span></strong>&nbsp;·&nbsp;Mesa&nbsp;<span id="table-num">—</span>
  </p>

  <div class="pago-ok__eta">
    <span class="eta-label">Tiempo estimado</span>
    <span class="eta-value" id="eta-value">20–25 min</span>
    <div class="eta-bar" role="progressbar" aria-label="Progreso de preparación"
         aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
      <div class="eta-bar__fill" id="eta-fill"></div>
    </div>
    <p class="eta-note" id="status-text">El mozo te avisa cuando esté listo</p>
  </div>

  <div class="status-chip" id="status-chip">
    <span class="status-dot"></span>
    <span id="status-label">En cocina</span>
  </div>

  <a href="menu.html" id="back-link" class="btn-back">← Volver al menú</a>

</main>

<script type="module">
  import { supabase } from './lib/supabase.js'

  // Leer params de URL con fallback a localStorage
  const p = new URLSearchParams(location.search)
  const slug       = p.get('slug')     || p.get('restaurant') || localStorage.getItem('vt_slug') || ''
  const mesa       = p.get('mesa')     || p.get('table')      || localStorage.getItem('vt_mesa') || '—'
  const orderId    = p.get('order_id') || p.get('order')      || localStorage.getItem('vt_last_order') || ''
  const pagoStatus = p.get('pago_status') || 'success'

  // Modo consolidado: viene de pago de mesa (restaurant)
  const isConsolidado = p.get('consolidated') === '1'
  const orderIdsParam = p.get('order_ids') || ''
  const orderIds      = orderIdsParam ? orderIdsParam.split(',').filter(Boolean) : []

  // Link volver al menú
  if (slug) {
    document.getElementById('back-link').href =
      'menu.html?slug=' + slug + (mesa && mesa !== '—' ? '&mesa=' + mesa : '')
  }

  if (isConsolidado && orderIds.length > 0) {
    // ── Modo pago consolidado (restaurant) ──────────────────────────────────
    const mesaLabel = mesa && mesa !== '—' ? 'Mesa ' + mesa : 'Visita'

    // Adaptar UI al pago MP
    document.getElementById('order-num').textContent = orderIds.length + (orderIds.length === 1 ? ' pedido' : ' pedidos')
    document.getElementById('table-num').textContent = mesaLabel
    document.querySelector('.pago-ok__title').textContent = pagoStatus === 'failure' ? 'Algo salió mal' : '¡Gracias!'
    document.querySelector('.pago-ok__sub').textContent   = pagoStatus === 'failure'
      ? 'El pago no se completó. Podés intentar de nuevo.'
      : 'Tu pago fue procesado. ¡Que lo disfruten!'

    // ETA y chips: para pago no tiene sentido mostrar tiempo de cocina
    const etaBlock = document.querySelector('.pago-ok__eta')
    if (etaBlock) etaBlock.style.display = 'none'
    const statusChip = document.getElementById('status-chip')
    if (statusChip && pagoStatus !== 'failure') statusChip.innerHTML = '<span class="status-dot"></span><span>Pago confirmado ✓</span>'

    // Desglose de órdenes — consulta Supabase
    if (pagoStatus !== 'failure') {
      try {
        const { data: ordersData } = await supabase
          .from('orders')
          .select('id, total, order_items(name, quantity, price)')
          .in('id', orderIds)

        if (ordersData?.length) {
          let grandTotal = 0
          const desglose = ordersData.map((o, i) => {
            const items = (o.order_items || []).map(it => `${it.quantity}x ${it.name}`).join(', ')
            const subtotal = Number(o.total || 0)
            grandTotal += subtotal
            return `<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--vt-border)">
              <span style="font-weight:500">Pedido ${i+1}</span> · $${subtotal.toLocaleString('es-AR')}
              <div style="font-size:11px;color:var(--vt-text-3);margin-top:2px">${items}</div>
            </div>`
          }).join('')

          const etaEl = document.querySelector('.pago-ok__eta')
          if (etaEl) {
            etaEl.style.display = 'flex'
            etaEl.innerHTML = `
              <span class="eta-label">${mesaLabel} — ${ordersData.length} pedido${ordersData.length !== 1 ? 's' : ''}</span>
              <div>${desglose}</div>
              <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:6px">
                <span>Total pagado</span>
                <span style="color:var(--vt-brand-light)">$${grandTotal.toLocaleString('es-AR')}</span>
              </div>`
          }
        }
      } catch {}
    }

  } else {
    // ── Modo orden individual (todos los tipos de negocio) ───────────────────
    if (orderId) document.getElementById('order-num').textContent = orderId.slice(-6).toUpperCase()
    if (mesa && mesa !== '—') document.getElementById('table-num').textContent = mesa

    // Barra de progreso animada
    const fill = document.getElementById('eta-fill')
    const bar  = fill?.closest('[role="progressbar"]')
    let pct = 10
    const ticker = setInterval(() => {
      pct = Math.min(pct + 1, 85)
      if (fill) fill.style.width = pct + '%'
      bar?.setAttribute('aria-valuenow', pct)
      if (pct >= 85) clearInterval(ticker)
    }, 300)

    // Polling de estado real si tenemos orderId
    if (orderId) {
      const statusMap = {
        pending:   { label: 'Pedido recibido', note: 'Lo arrancan en un momento...', pct: 20, eta: '20–25 min' },
        confirmed: { label: 'Confirmado', note: '¡Ya arrancan!', pct: 35, eta: '15–20 min' },
        preparing: { label: 'En preparación 🍳', note: 'Tu pedido está en cocina', pct: 65, eta: '10–15 min' },
        ready:     { label: '¡Listo para entregar! 🎉', note: 'El mozo ya va a tu mesa', pct: 100, eta: 'Ahora' },
        delivered: { label: '¡Entregado! 🎉', note: '¡Que lo disfrutes!', pct: 100, eta: '—' },
      }

      async function checkStatus() {
        try {
          const { data, error } = await supabase
            .from('orders')
            .select('status')
            .eq('id', orderId)
            .single()
          if (error || !data) return
          const s = statusMap[data.status]
          if (!s) return
          document.getElementById('status-label').textContent = s.label
          document.getElementById('status-text').textContent  = s.note
          document.getElementById('eta-value').textContent    = s.eta
          clearInterval(ticker)
          if (fill) fill.style.width = s.pct + '%'
          bar?.setAttribute('aria-valuenow', s.pct)
          if (data.status === 'ready' || data.status === 'delivered') {
            clearInterval(pollInterval)
          }
        } catch {}
      }

      checkStatus()
      const pollInterval = setInterval(checkStatus, 15000)
    }
  }
</script>
</body>
</html>
