<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido confirmado — Vitrina</title>
  <link rel="stylesheet" href="lib/vitrina-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--vt-bg);
      font-family: var(--font-body);
      color: var(--vt-text-1);
    }
    .pago-ok {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-6);
      padding: var(--sp-8) var(--page-x);
      text-align: center;
    }
    .pago-ok__icon {
      font-size: 56px;
      line-height: 1;
      animation: pop .4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
    .pago-ok__title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
    }
    .pago-ok__sub {
      font-size: 15px;
      color: var(--vt-text-2);
      margin-top: -8px;
    }
    .pago-ok__badge {
      font-size: 14px;
      color: var(--vt-text-2);
      background: var(--vt-surface);
      border: 1px solid var(--vt-border);
      padding: var(--sp-3) var(--sp-5);
      border-radius: var(--r-full);
      font-weight: 600;
      letter-spacing: .03em;
    }
    .pago-ok__eta {
      width: 100%;
      max-width: 320px;
      background: var(--vt-surface);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      text-align: left;
    }
    .eta-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--vt-text-3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .eta-value { font-size: 24px; font-weight: 700; color: var(--vt-brand-light); }
    .eta-bar {
      height: 6px;
      background: var(--vt-border);
      border-radius: var(--r-full);
      overflow: hidden;
    }
    .eta-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--vt-brand), var(--vt-brand-light));
      border-radius: var(--r-full);
      width: 10%;
      transition: width .8s ease;
    }
    .eta-note { font-size: 13px; color: var(--vt-text-3); }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      background: var(--vt-success-bg);
      color: var(--vt-success);
      border: 1px solid rgba(46,204,113,.25);
      border-radius: var(--r-full);
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--vt-success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }
    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      min-height: 48px;
      background: var(--vt-surface);
      border: 1px solid var(--vt-border-strong);
      border-radius: var(--r-md);
      color: var(--vt-text-1);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background var(--dur-base);
    }
    .btn-back:hover { background: var(--vt-surface-high); }
  </style>
</head>
<body>
<main class="pago-ok" role="main">

  <div class="pago-ok__icon" aria-hidden="true">✅</div>
  <h1 class="pago-ok__title">¡Todo listo!</h1>
  <p class="pago-ok__sub">Tu pedido fue enviado a cocina</p>

  <p class="pago-ok__badge" role="status" id="order-badge">
    Pedido&nbsp;<strong>#<span id="order-num">—</span></strong>&nbsp;·&nbsp;Mesa&nbsp;<span id="table-num">—</span>
  </p>

  <div class="pago-ok__eta">
    <span class="eta-label">Tiempo estimado</span>
    <span class="eta-value" id="eta-value">20–25 min</span>
    <div class="eta-bar" role="progressbar" aria-label="Progreso de preparación"
         aria-valuenow="10" aria-valuemin="0" aria-valuemax="100">
      <div class="eta-bar__fill" id="eta-fill"></div>
    </div>
    <p class="eta-note" id="status-text">El mozo te avisa cuando esté listo</p>
  </div>

  <div class="status-chip" id="status-chip">
    <span class="status-dot"></span>
    <span id="status-label">En cocina</span>
  </div>

  <a href="menu.html" id="back-link" class="btn-back">← Volver al menú</a>

</main>

<script type="module">
  import { supabase } from './lib/supabase.js'

  // Leer params de URL con fallback a localStorage
  const p = new URLSearchParams(location.search)
  const slug     = p.get('slug')     || p.get('restaurant') || localStorage.getItem('vt_slug') || ''
  const mesa     = p.get('mesa')     || p.get('table')      || localStorage.getItem('vt_mesa') || '—'
  const orderId  = p.get('order_id') || p.get('order')      || localStorage.getItem('vt_last_order') || ''

  // Mostrar datos
  if (orderId) document.getElementById('order-num').textContent = orderId.slice(-6).toUpperCase()
  if (mesa && mesa !== '—') document.getElementById('table-num').textContent = mesa

  // Link volver al menú
  if (slug) {
    document.getElementById('back-link').href =
      'menu.html?slug=' + slug + (mesa && mesa !== '—' ? '&mesa=' + mesa : '')
  }

  // Barra de progreso animada
  const fill = document.getElementById('eta-fill')
  const bar  = fill?.closest('[role="progressbar"]')
  let pct = 10
  const ticker = setInterval(() => {
    pct = Math.min(pct + 1, 85)
    fill.style.width = pct + '%'
    bar?.setAttribute('aria-valuenow', pct)
    if (pct >= 85) clearInterval(ticker)
  }, 300)

  // Polling de estado real si tenemos orderId
  if (orderId) {
    const statusMap = {
      pending:   { label: 'Pedido recibido', note: 'Lo arrancan en un momento...', pct: 20, eta: '20–25 min' },
      confirmed: { label: 'Confirmado', note: '¡Ya arrancan!', pct: 35, eta: '15–20 min' },
      preparing: { label: 'En preparación 🍳', note: 'Tu pedido está en cocina', pct: 65, eta: '10–15 min' },
      ready:     { label: '¡Listo para entregar! 🎉', note: 'El mozo ya va a tu mesa', pct: 100, eta: 'Ahora' },
      delivered: { label: '¡Entregado! 🎉', note: '¡Que lo disfrutes!', pct: 100, eta: '—' },
    }

    async function checkStatus() {
      try {
        const { data, error } = await supabase
          .from('orders')
          .select('status')
          .eq('id', orderId)
          .single()
        if (error || !data) return
        const s = statusMap[data.status]
        if (!s) return
        // Actualizar UI
        document.getElementById('status-label').textContent = s.label
        document.getElementById('status-text').textContent  = s.note
        document.getElementById('eta-value').textContent    = s.eta
        clearInterval(ticker)
        fill.style.width = s.pct + '%'
        bar?.setAttribute('aria-valuenow', s.pct)
        if (data.status === 'ready' || data.status === 'delivered') {
          clearInterval(pollInterval)
        }
      } catch {}
    }

    checkStatus()
    const pollInterval = setInterval(checkStatus, 15000)
  }
</script>
</body>
</html>
