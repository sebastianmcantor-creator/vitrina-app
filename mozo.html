<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Asistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1a1208; font-family: 'DM Sans', sans-serif; overflow: hidden; }

    .screen {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 480px; margin: 0 auto; background: #1a1208;
    }

    .header { padding: 16px 20px 12px; border-bottom: 0.5px solid #2e2410; flex-shrink: 0; }
    .restaurant-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 500; color: #e8c87a; letter-spacing: 0.02em; }
    .table-badge { font-size: 11px; color: #8a7450; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5a9e6a; margin-right: 5px; vertical-align: middle; }

    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
    .messages::-webkit-scrollbar { display: none; }

    .msg { max-width: 82%; font-size: 14px; line-height: 1.55; animation: msgIn 0.25s ease backwards; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg-bubble { padding: 10px 14px; border-radius: 18px; }
    .msg.bot .msg-bubble { background: #2a2010; color: #d4b97a; border-bottom-left-radius: 4px; border: 0.5px solid #3a2e1a; }
    .msg.user .msg-bubble { background: #c8a84a; color: #1a1208; border-bottom-right-radius: 4px; font-weight: 500; }
    .msg-label { font-size: 10px; color: #5a4a2a; margin-bottom: 4px; padding-left: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    .typing { align-self: flex-start; display: none; }
    .typing .msg-bubble { background: #2a2010; border: 0.5px solid #3a2e1a; padding: 12px 16px; display: flex; gap: 4px; align-items: center; border-bottom-left-radius: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #c8a84a; opacity: 0.4; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

    .suggestions { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .suggestion-btn { background: #2a2010; border: 0.5px solid #4a3820; color: #c8a84a; font-size: 12px; font-family: 'DM Sans', sans-serif; padding: 7px 12px; border-radius: 20px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .suggestion-btn:hover { background: #3a2e18; }

    .error-msg { font-size: 12px; color: #8a5a3a; text-align: center; padding: 4px 16px; display: none; flex-shrink: 0; }

    .input-area { padding: 10px 14px 24px; display: flex; gap: 8px; align-items: center; border-top: 0.5px solid #2e2410; flex-shrink: 0; }
    .chat-input { flex: 1; background: #2a2010; border: 0.5px solid #4a3820; border-radius: 22px; padding: 10px 16px; color: #e8c87a; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; -webkit-appearance: none; transition: border-color 0.2s; }
    .chat-input:focus { border-color: #c8a84a; }
    .chat-input::placeholder { color: #5a4a2a; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #c8a84a; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
    .send-btn:hover { background: #e8c87a; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 17px; height: 17px; }

    .loading-overlay { position: fixed; inset: 0; background: #1a1208; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; transition: opacity 0.5s; }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-logo { font-family: 'Playfair Display', serif; font-size: 32px; color: #e8c87a; letter-spacing: 0.05em; }
    .loading-sub { font-size: 11px; color: #5a4a2a; letter-spacing: 0.12em; text-transform: uppercase; }
    .loading-bar { width: 100px; height: 1px; background: #2a2010; overflow: hidden; }
    .loading-bar-fill { height: 100%; background: #c8a84a; width: 0%; animation: load 1.4s ease forwards; }
    @keyframes load { to { width: 100%; } }

    #error-screen { position: fixed; inset: 0; background: #1a1208; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #8a7450; font-size: 14px; text-align: center; padding: 20px; }

    .lang-switcher { display: flex; gap: 4px; margin-top: 6px; }
    .lang-btn { background: transparent; border: 0.5px solid #3a2e1a; color: #5a4a2a; font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 3px 8px; border-radius: 6px; cursor: pointer; transition: all .15s; letter-spacing: .03em; }
    .lang-btn.active { background: #2a2010; border-color: #c8a84a; color: #c8a84a; }
    .lang-btn:hover:not(.active) { border-color: #5a4a2a; color: #8a7450; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loader">
    <div class="loading-logo" id="loader-name">Cargando</div>
    <div class="loading-sub">Asistente de menú</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <div id="error-screen">
    <div style="font-size:36px">😕</div>
    <div id="error-msg"></div>
  </div>

  <div class="screen">
    <div class="header" style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="restaurant-name" id="rest-name">—</div>
        <div class="table-badge" id="table-badge">
          <span class="status-dot"></span>Asistente activo
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="btn-new-session" onclick="newSession()" title="Nueva sesión"
          style="display:none;background:none;border:0.5px solid #3a2e1a;color:#6a5a3a;
                 border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;
                 font-family:'DM Sans',sans-serif;transition:color .2s">🔄</button>
        <div class="lang-switcher" id="lang-switcher">
          <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" data-lang="pt" onclick="setLang('pt')">PT</button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg typing" id="typing">
        <div class="msg-label" style="opacity:0.6">Tano está escribiendo</div>
        <div class="msg-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="error-msg" id="api-error"></div>
    <div id="tano-limit-alert" style="display:none;padding:8px 16px;background:#3a1f0a;color:#e8a06a;font-size:12px;text-align:center;border-top:1px solid #4a2f1a"></div>

    <!-- Botón llamar al mozo (se muestra después de ciertos mensajes) -->
    <div id="call-waiter-bar" style="display:none;padding:8px 16px 4px;border-top:0.5px solid #2e2410">
      <button id="call-waiter-btn" onclick="callWaiter()"
        style="width:100%;background:#2a2010;border:0.5px solid #4a3820;color:#c8a84a;
               font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 16px;
               border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
        🙋 Llamar al mozo
      </button>
    </div>

    <div class="input-area">
      <input class="chat-input" id="chat-input" type="text" placeholder="Preguntame lo que quieras..." />
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1208" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { restaurants } from './lib/db.js'

    const BACKEND = 'https://vitrina-tano.vitrinaapp.workers.dev'
    const TAG_LABELS = { veg: 'Vegetariano', vegan: 'Vegano', celiac: 'Sin TACC', popular: 'Muy pedido', spicy: 'Picante', new: 'Nuevo' }

    const params = new URLSearchParams(location.search)
    const slug = params.get('slug')
    const mesa = params.get('mesa')

    let systemPrompt = ''
    let conversationHistory = []
    let isLoading = false
    let currentRestaurantId = null
    let tanoLimitReached = false
    let currentRestData = null
    let currentLang = 'es'

    // ─── Session management ──────────────────────────────────────────────────
    const SESSION_KEY = 'tano_session_' + (slug || '') + '_' + (mesa || '')
    const SESSION_MAX_MS = 4 * 60 * 60 * 1000 // 4 horas

    function sessionIsStale() {
      const ts = sessionStorage.getItem(SESSION_KEY)
      if (!ts) return false
      return (Date.now() - parseInt(ts, 10)) > SESSION_MAX_MS
    }

    function stampSession() {
      sessionStorage.setItem(SESSION_KEY, Date.now().toString())
    }

    window.newSession = function () {
      conversationHistory = []
      userMsgCount = 0
      tanoLimitReached = false
      stampSession()
      // Clear messages
      const messagesEl = document.getElementById('messages')
      const typing = document.getElementById('typing')
      Array.from(messagesEl.children).forEach(el => { if (el !== typing) el.remove() })
      // Hide waiter bar and tano limit alert
      document.getElementById('call-waiter-bar').style.display = 'none'
      document.getElementById('tano-limit-alert').style.display = 'none'
      if (currentRestData) addGreeting(currentRestData, currentLang)
    }

    // Auto-detectar idioma del navegador
    ;(function detectLang() {
      const nav = (navigator.language || 'es').toLowerCase().slice(0, 2)
      if (nav === 'en') currentLang = 'en'
      else if (nav === 'pt') currentLang = 'pt'
      else currentLang = 'es'
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang)
      })
    })()

    async function init() {
      if (!slug) { showError('URL inválida — falta el parámetro slug.'); return }

      let rest
      try {
        rest = await restaurants.getBySlug(slug)
      } catch {
        showError('No se encontró el restaurante "' + slug + '".')
        return
      }

      currentRestaurantId = rest.id
      currentRestData = rest
      document.getElementById('loader-name').textContent = rest.name
      document.getElementById('rest-name').textContent = rest.name
      document.title = rest.name + ' — Asistente'

      // Mostrar logo si existe
      if (rest.logo_url) {
        const logoEl = document.getElementById('rest-name')
        logoEl.insertAdjacentHTML('beforebegin',
          '<img src="' + rest.logo_url + '" alt="Logo" style="width:32px;height:32px;border-radius:6px;object-fit:contain;margin-bottom:4px;display:block">')
      }

      // Badge: mesa + estado del restaurante
      ;(function updateBadge() {
        const parts = []
        if (mesa) parts.push('Mesa ' + mesa)

        // Estado según horarios
        if (rest.opening_hours) {
          const now  = new Date()
          const day  = now.getDay()
          const hm   = now.getHours() * 100 + now.getMinutes()
          const raw  = rest.opening_hours[day]
          const toN  = s => { const [hh, mm] = s.split(':').map(Number); return hh*100+mm }
          if (!raw) {
            parts.push('🔴 Cerrado hoy')
          } else {
            const slots = Array.isArray(raw) ? raw : [raw]
            const isOpen = slots.some(s => hm >= toN(s.o) && hm < toN(s.c))
            const nextSlot = slots.find(s => hm < toN(s.o))
            if (isOpen) parts.push('🟢 Abierto')
            else if (nextSlot) parts.push('🕐 Abre a las ' + nextSlot.o)
            else parts.push('🔴 Cerrado')
          }
        } else {
          parts.push('Asistente activo')
        }

        document.getElementById('table-badge').innerHTML =
          '<span class="status-dot"></span>' + parts.join(' · ')
      })()

      systemPrompt = buildSystemPrompt(rest)
      buildSuggestions(rest)

      // Si la sesión es stale, arrancar limpio igual (ya conversationHistory = [])
      if (sessionIsStale()) {
        conversationHistory = []
      }
      stampSession()

      addGreeting(rest)

      // Mostrar botón de nueva sesión luego de cargar (para staff)
      document.getElementById('btn-new-session').style.display = 'block'

      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden')
      }, 1400)

      document.getElementById('chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendMessage()
      })

      // Revisar staleness en cada foco de la ventana
      window.addEventListener('focus', () => {
        if (sessionIsStale() && currentRestData) {
          newSession()
        }
      })
    }

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden')
      document.getElementById('error-msg').textContent = msg
      document.getElementById('error-screen').style.display = 'flex'
    }

    // ─── Menu text builder ────────────────────────────────────────────────────
    function buildMenuText(rest) {
      const cats = (rest.menu_categories || [])
        .filter(c => c.is_visible)
        .sort((a, b) => a.sort_order - b.sort_order)

      return cats.map(cat => {
        const items = (cat.menu_items || [])
          .filter(i => i.is_visible && i.is_available)
          .sort((a, b) => a.sort_order - b.sort_order)
        if (!items.length) return ''
        const lines = items.map(item => {
          const price = '$' + Number(item.price).toLocaleString('es-AR')
          const tags = (item.tags || []).map(t => TAG_LABELS[t]).filter(Boolean).join(', ')
          const star = item.is_featured ? '⭐ ' : ''
          return '- ' + star + item.name + ' (' + price + ')'
            + (item.description ? ': ' + item.description : '')
            + (tags ? '. ' + tags + '.' : '')
            + (item.is_featured ? ' [DESTACADO]' : '')
        }).join('\n')
        return (cat.emoji ? cat.emoji + ' ' : '') + cat.name.toUpperCase() + ':\n' + lines
      }).filter(Boolean).join('\n\n')
    }

    function buildFeaturedLine(rest) {
      const featured = (rest.menu_categories || []).flatMap(cat =>
        (cat.menu_items || []).filter(i => i.is_visible && i.is_available && i.is_featured)
      )
      if (!featured.length) return ''
      const names = featured.map(i => i.name).join(', ')
      return '\nPLATOS DESTACADOS (recomendá estos primero cuando te pregunten qué pedir): ' + names
    }

    function buildHoursText(hours) {
      if (!hours) return ''
      const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']
      const lines = DAYS.map((d, i) => {
        const raw = hours[i]
        if (!raw) return d + ': Cerrado'
        const slots = Array.isArray(raw) ? raw : [raw]
        return d + ': ' + slots.map(s => s.o + ' – ' + s.c).join(' y ')
      })
      return lines.join(' | ')
    }

    function buildSystemPrompt(rest) {
      const menuText = buildMenuText(rest)
      const featuredLine = buildFeaturedLine(rest)
      const location = [rest.address, rest.city].filter(Boolean).join(', ')
      const tone = rest.tano_tone || 'calido'
      const hoursLine = rest.opening_hours ? '\nHorarios: ' + buildHoursText(rest.opening_hours) : ''

      // Información de agenda/turnos si está configurada
      let agendaLine = ''
      if (rest.business_type === 'services' || rest.business_type === 'restaurant') {
        const hasAgenda = rest.business_type !== 'local' && rest.business_type !== 'ecommerce'
        if (hasAgenda) {
          if (rest.business_type === 'restaurant') {
            agendaLine = '\nRESERVAS: Los clientes pueden reservar mesa escribiendo por WhatsApp al número de reservas del restaurante. Podés informar sobre disponibilidad general pero no confirmás reservas desde este chat.'
          } else {
            agendaLine = '\nTURNOS: Los clientes pueden sacar turno escribiendo por WhatsApp al número de turnos del negocio. Podés informar que hay sistema de turnos disponible y dar el link de WhatsApp si te preguntan.'
          }
        }
      }

      const toneDesc = tone === 'sofisticado'
        ? 'Tu tono es elegante y sofisticado. Vocabulario cuidado, sin contracciones informales ni emojis excesivos. Transmitís exclusividad.'
        : tone === 'neutro'
          ? 'Tu tono es amable y profesional. Ni muy formal ni muy informal. Emojis con moderación.'
          : /* calido */ 'Tu tono es cálido, informal y porteño. Tratás al cliente de vos, usás expresiones del Río de la Plata (che, dale, etc.). Emojis con moderación.'

      return 'Sos Tano, el asistente digital de ' + rest.name
        + (location ? ', un restaurante en ' + location : '') + '.'
        + hoursLine
        + ' Tu nombre es Tano. Sonas humano, nunca como un bot genérico.\n\n'
        + toneDesc + '\n\n'
        + (LANG_INSTRUCTION[currentLang] ? LANG_INSTRUCTION[currentLang] + '\n\n' : '')
        + 'REGLAS:\n'
        + '1. Solo respondés sobre el menú, platos, ingredientes, alérgenos, opciones dietarias y el restaurante.\n'
        + '2. Si te preguntan algo ajeno: "Eso no te lo puedo contestar yo, pero el equipo del restaurante te ayuda con gusto."\n'
        + '3. Nunca inventés platos ni precios. Si algo no figura, decí que consulten al personal.\n'
        + '4. Respuestas concisas, máximo 3-4 líneas. Si hay lista, viñetas cortas.\n\n'
        + featuredLine
        + agendaLine + '\n\n'
        + 'MENÚ DISPONIBLE:\n' + menuText
    }

    function buildSuggestions(rest) {
      const cats = (rest.menu_categories || [])
        .filter(c => c.is_visible)
        .sort((a, b) => a.sort_order - b.sort_order)
        .slice(0, 3)

      const hasFeatured = (rest.menu_categories || []).some(cat =>
        (cat.menu_items || []).some(i => i.is_visible && i.is_available && i.is_featured)
      )

      const menuLink = 'menu.html?slug=' + encodeURIComponent(rest.slug) + (mesa ? '&mesa=' + mesa : '')

      const el = document.getElementById('suggestions')
      el.innerHTML = (hasFeatured
        ? '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cuáles son los platos destacados?\')">⭐ Destacados</button>'
        : '')
        + cats.map(cat =>
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué ' + cat.name.toLowerCase() + ' tienen?\')">'
          + (cat.emoji ? cat.emoji + ' ' : '') + cat.name + '</button>'
        ).join('')
        + '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué opciones veganas tienen?\')">Vegano</button>'
        + '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué platos son sin TACC?\')">Sin TACC</button>'
        + '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué me recomendás?\')">Recomendaciones</button>'
        + '<a class="suggestion-btn" href="' + menuLink + '" style="text-decoration:none;display:inline-block">📋 Ver menú completo</a>'
    }

    const LANG_GREETINGS = {
      en: name => `Hello! Welcome to ${name} 👋 I'm Tano, your menu assistant. I can help you with dishes, ingredients, vegetarian, vegan or gluten-free options, and recommendations. What can I help you with?`,
      pt: name => `Olá! Bem-vindo ao ${name} 👋 Sou o Tano, seu assistente de cardápio. Posso ajudar com pratos, ingredientes, opções vegetarianas, veganas ou sem glúten, e recomendações. Em que posso ajudar?`,
      es: name => null, // usa tano_welcome o default en español
    }

    const LANG_INSTRUCTION = {
      en: 'IMPORTANT: The customer is writing in English. Always respond in English regardless of what language the menu items are written in.',
      pt: 'IMPORTANTE: O cliente está escrevendo em português. Sempre responda em português, independentemente do idioma dos itens do menu.',
      es: '',
    }

    function addGreeting(rest, lang = currentLang) {
      // Verificar si está cerrado ahora
      let closedNote = ''
      if (rest.opening_hours) {
        const now = new Date()
        const day = now.getDay()
        const hm  = now.getHours() * 100 + now.getMinutes()
        const toN = s => { const [hh,mm] = s.split(':').map(Number); return hh*100+mm }
        const h   = rest.opening_hours[day]
        if (!h || hm < toN(h.o) || hm >= toN(h.c)) {
          closedNote = ' (Estamos cerrados ahora, pero te respondo igual 😊)'
        }
      }

      let msg
      if (lang !== 'es') {
        msg = LANG_GREETINGS[lang](rest.name)
      } else {
        msg = rest.tano_welcome?.trim()
          || '¡Hola! Bienvenido a ' + rest.name + ' 👋 Soy Tano, tu asistente de menú. '
            + 'Puedo ayudarte con los platos, ingredientes, opciones vegetarianas, veganas o sin TACC, y hacerte recomendaciones. '
            + '¿En qué te puedo ayudar?'
      }
      if (typeof msg === 'string') msg += closedNote
      addMessage('assistant', msg)
    }

    window.setLang = function (lang) {
      if (lang === currentLang || !currentRestData) return
      currentLang = lang

      // Actualizar botones
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang)
      })

      // Regenerar system prompt con nuevo idioma
      systemPrompt = buildSystemPrompt(currentRestData)

      // Limpiar conversación y saludar de nuevo
      conversationHistory = []
      const messagesEl = document.getElementById('messages')
      const typing = document.getElementById('typing')
      // Mantener solo el typing indicator
      Array.from(messagesEl.children).forEach(el => {
        if (el !== typing) el.remove()
      })
      addGreeting(currentRestData, lang)
    }

    // ─── Chat ─────────────────────────────────────────────────────────────────
    function addMessage(role, text) {
      const messages = document.getElementById('messages')
      const typing = document.getElementById('typing')
      const div = document.createElement('div')
      div.className = 'msg ' + (role === 'user' ? 'user' : 'bot')
      const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
      if (role === 'assistant') {
        div.innerHTML = '<div class="msg-label">Asistente</div><div class="msg-bubble">' + text.replace(/\n/g, '<br>') + '</div><div style="font-size:10px;color:#3a2e18;padding:2px 4px;margin-top:2px">' + timeStr + '</div>'
      } else {
        div.innerHTML = '<div class="msg-bubble">' + text + '</div><div style="font-size:10px;color:rgba(26,18,8,.5);padding:2px 4px;margin-top:2px;text-align:right">' + timeStr + '</div>'
      }
      messages.insertBefore(div, typing)
      messages.scrollTop = messages.scrollHeight
    }

    function showTyping(show) {
      document.getElementById('typing').style.display = show ? 'flex' : 'none'
      if (show) {
        const messages = document.getElementById('messages')
        messages.scrollTop = messages.scrollHeight
      }
    }

    // Llamar al mozo — counter (definido antes de sendMessage que lo usa)
    const CALL_WAITER_AFTER_MSGS = 3
    let userMsgCount = 0
    function maybeShowCallWaiter() {
      userMsgCount++
      if (userMsgCount >= CALL_WAITER_AFTER_MSGS) {
        document.getElementById('call-waiter-bar').style.display = 'block'
      }
    }

    async function sendMessage() {
      if (isLoading) return
      const input = document.getElementById('chat-input')
      const text = input.value.trim()
      if (!text) return

      input.value = ''
      document.getElementById('suggestions').style.display = 'none'
      addMessage('user', text)
      conversationHistory.push({ role: 'user', content: text })
      maybeShowCallWaiter()
      isLoading = true
      showTyping(true)

      const errorEl = document.getElementById('api-error')
      errorEl.style.display = 'none'

      // Si ya llegó al límite, responder sin llamar a la API
      if (tanoLimitReached) {
        showTyping(false)
        addMessage('assistant', 'Por ahora no puedo seguir respondiendo — llegué al límite de mensajes del mes. El equipo del restaurante te atiende con gusto 😊')
        isLoading = false
        return
      }

      let attempts = 0
      while (attempts < 3) {
        try {
          const res = await fetch(BACKEND + '/api/claude', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system: systemPrompt,
              messages: conversationHistory,
              max_tokens: 1000,
              restaurantId: currentRestaurantId,
              assistantType: 'tano',
            })
          })

          if (res.status === 529) {
            attempts++
            if (attempts < 3) {
              errorEl.style.display = 'block'
              errorEl.textContent = 'Servidor ocupado, reintentando (' + attempts + '/3)...'
              await new Promise(r => setTimeout(r, 3000))
              continue
            }
          }

          if (!res.ok) throw new Error('Error ' + res.status)

          const data = await res.json()

          // Manejar límite de Tano
          if (data.tano_limit_reached) {
            tanoLimitReached = true
            document.getElementById('chat-input').disabled = true
            document.querySelector('.send-btn').disabled = true
          }

          // Mostrar alerta si quedan pocos mensajes
          if (data.tano_remaining !== undefined && data.tano_remaining <= 15 && data.tano_remaining > 0) {
            const alertEl = document.getElementById('tano-limit-alert')
            if (alertEl) {
              alertEl.style.display = 'block'
              alertEl.textContent = `⚠️ Quedan ${data.tano_remaining} respuestas disponibles este mes.`
            }
          }

          const reply = data.content?.[0]?.text || 'No pude procesar tu consulta. ¿Podés repetirla?'
          conversationHistory.push({ role: 'assistant', content: reply })
          showTyping(false)
          addMessage('assistant', reply)
          errorEl.style.display = 'none'
          break
        } catch {
          attempts++
          if (attempts >= 3) {
            showTyping(false)
            addMessage('assistant', 'Ups, tuve un problema técnico. ¿Podés intentarlo de nuevo?')
          } else {
            await new Promise(r => setTimeout(r, 3000))
          }
        }
      }

      isLoading = false
    }

    window.sendMessage = sendMessage
    window.sendSuggestion = function(text) {
      document.getElementById('chat-input').value = text
      sendMessage()
    }

    window.callWaiter = function () {
      // Si el restaurante tiene teléfono, abrir WhatsApp; si no, solo mostrar mensaje
      const btn = document.getElementById('call-waiter-btn')
      const phone = currentRestData?.phone?.replace(/\D/g, '')
      if (phone) {
        const waUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(
          (mesa ? 'Mesa ' + mesa + ': ' : '') + 'Hola, necesito ayuda con mi pedido.'
        )
        window.open(waUrl, '_blank')
      } else {
        // Sin teléfono: mostrar mensaje en el chat y ocultar el botón
        addMessage('assistant', '🙋 ¡Perfecto! Levantá la mano y un mozo se acerca enseguida.')
        document.getElementById('call-waiter-bar').style.display = 'none'
      }
    }

    init()
  </script>
</body>
</html>
