<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Asistente</title>
  <link rel="stylesheet" href="lib/vitrina-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1a1208; font-family: 'DM Sans', sans-serif; overflow: hidden; }

    .screen {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 480px; margin: 0 auto; background: #1a1208;
    }

    .header { padding: 16px 20px 12px; border-bottom: 0.5px solid #2e2410; flex-shrink: 0; }
    .restaurant-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 500; color: #e8c87a; letter-spacing: 0.02em; }
    .table-badge { font-size: 11px; color: #8a7450; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5a9e6a; margin-right: 5px; vertical-align: middle; }

    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
    .messages::-webkit-scrollbar { display: none; }

    .msg { max-width: 82%; font-size: 14px; line-height: 1.55; animation: msgIn 0.25s ease backwards; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg-bubble { padding: 10px 14px; border-radius: 18px; }
    .msg.bot .msg-bubble { background: #2a2010; color: #d4b97a; border-bottom-left-radius: 4px; border: 0.5px solid #3a2e1a; }
    .msg.user .msg-bubble { background: #c8a84a; color: #1a1208; border-bottom-right-radius: 4px; font-weight: 500; }
    .msg-label { font-size: 10px; color: #5a4a2a; margin-bottom: 4px; padding-left: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    .typing { align-self: flex-start; display: none; }
    .typing .msg-bubble { background: #2a2010; border: 0.5px solid #3a2e1a; padding: 12px 16px; display: flex; gap: 4px; align-items: center; border-bottom-left-radius: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #c8a84a; opacity: 0.4; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

    .suggestions { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .suggestion-btn { background: #2a2010; border: 0.5px solid #4a3820; color: #c8a84a; font-size: 12px; font-family: 'DM Sans', sans-serif; padding: 7px 12px; min-height: 36px; border-radius: 20px; cursor: pointer; transition: background 0.15s; white-space: nowrap; display: inline-flex; align-items: center; }
    .suggestion-btn:hover { background: #3a2e18; }

    .error-msg { font-size: 12px; color: #8a5a3a; text-align: center; padding: 4px 16px; display: none; flex-shrink: 0; }

    .input-area { padding: 10px 14px 24px; display: flex; gap: 8px; align-items: center; border-top: 0.5px solid #2e2410; flex-shrink: 0; }
    /* 16px mínimo: Safari iOS hace zoom automático al enfocar inputs con font-size < 16px */
    .chat-input { flex: 1; background: #2a2010; border: 0.5px solid #4a3820; border-radius: 22px; padding: 10px 16px; color: #e8c87a; font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; -webkit-appearance: none; transition: border-color 0.2s; }
    .chat-input:focus { border-color: #c8a84a; }
    .chat-input::placeholder { color: #5a4a2a; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: #c8a84a; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
    .send-btn:hover { background: #e8c87a; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 17px; height: 17px; }

    .loading-overlay { position: fixed; inset: 0; background: #1a1208; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; transition: opacity 0.5s; }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-logo { font-family: 'Playfair Display', serif; font-size: 32px; color: #e8c87a; letter-spacing: 0.05em; }
    .loading-sub { font-size: 11px; color: #5a4a2a; letter-spacing: 0.12em; text-transform: uppercase; }
    .loading-bar { width: 100px; height: 1px; background: #2a2010; overflow: hidden; }
    .loading-bar-fill { height: 100%; background: #c8a84a; width: 0%; animation: load 1.4s ease forwards; }
    @keyframes load { to { width: 100%; } }

    #error-screen { position: fixed; inset: 0; background: #1a1208; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #8a7450; font-size: 14px; text-align: center; padding: 20px; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .lang-switcher { display: flex; gap: 4px; margin-top: 6px; }
    .lang-btn { background: transparent; border: 0.5px solid #3a2e1a; color: #5a4a2a; font-size: 11px; font-family: 'DM Sans', sans-serif; padding: 3px 8px; min-width: 44px; min-height: 44px; border-radius: 6px; cursor: pointer; transition: all .15s; letter-spacing: .03em; display: inline-flex; align-items: center; justify-content: center; }
    .lang-btn.active { background: #2a2010; border-color: #c8a84a; color: #c8a84a; }
    .lang-btn:hover:not(.active) { border-color: #5a4a2a; color: #8a7450; }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <div class="loading-overlay" id="loader">
    <div class="loading-logo" id="loader-name">Cargando</div>
    <div class="loading-sub" id="loading-sub-text">Asistente digital</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <div id="error-screen">
    <div style="font-size:36px">😕</div>
    <div id="error-msg"></div>
  </div>

  <div class="screen">
    <div class="header" style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="display:flex;align-items:center;gap:10px">
        <!-- Botón volver al menú -->
        <a id="back-to-menu" href="menu.html"
          style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;
                 color:#8a7450;font-size:18px;text-decoration:none;border-radius:8px;
                 transition:color .15s;flex-shrink:0"
          aria-label="Volver al menú">←</a>
        <div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:14px;font-weight:600;color:#e8c87a;letter-spacing:.02em">Tano</span>
            <span style="font-size:11px;color:#5a4a2a">·</span>
            <div class="restaurant-name" id="rest-name" style="font-size:13px;font-weight:400;color:#8a7450"></div>
          </div>
          <div class="table-badge" id="table-badge">
            <span class="status-dot"></span>Tu asistente del menú · En línea
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="btn-new-session" onclick="newSession()" title="Nueva sesión"
          style="display:none;background:none;border:0.5px solid #3a2e1a;color:#6a5a3a;
                 border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;
                 font-family:'DM Sans',sans-serif;transition:color .2s">🔄</button>
        <div class="lang-switcher" id="lang-switcher">
          <button class="lang-btn active" data-lang="es" onclick="setLang('es')" aria-label="Cambiar idioma a Español">ES</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')" aria-label="Cambiar idioma a Inglés">EN</button>
          <button class="lang-btn" data-lang="pt" onclick="setLang('pt')" aria-label="Cambiar idioma a Portugués">PT</button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg typing" id="typing">
        <div class="msg-label" style="opacity:0.6">Tano está pensando...</div>
        <div class="msg-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="error-msg" id="api-error"></div>
    <div id="tano-limit-alert" style="display:none;padding:8px 16px;background:#3a1f0a;color:#e8a06a;font-size:12px;text-align:center;border-top:1px solid #4a2f1a"></div>

    <!-- Botón llamar al mozo (se muestra después de ciertos mensajes) -->
    <div id="call-waiter-bar" style="display:none;padding:8px 16px 4px;border-top:0.5px solid #2e2410">
      <button id="call-waiter-btn" onclick="callWaiter()"
        style="width:100%;background:#2a2010;border:0.5px solid #4a3820;color:#c8a84a;
               font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 16px;
               min-height:44px;border-radius:12px;cursor:pointer;display:flex;
               align-items:center;justify-content:center;gap:8px">
        🙋 Llamar al mozo
      </button>
    </div>

    <div class="input-area">
      <label class="sr-only" for="chat-input">Escribile a Tano</label>
      <input class="chat-input" id="chat-input" type="text" placeholder="Escribile a Tano..." />
      <button class="send-btn" onclick="sendMessage()" aria-label="Enviar mensaje">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1208" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { restaurants } from './lib/db.js?v=8'

    const BACKEND = 'https://vitrina-tano.vitrinaapp.workers.dev'
    const TAG_LABELS = { veg: 'Vegetariano', vegan: 'Vegano', celiac: 'Sin TACC', popular: 'Muy pedido', spicy: 'Picante', new: 'Nuevo' }

    const params = new URLSearchParams(location.search)
    const slug = params.get('slug')
    const mesa = params.get('mesa')

    let systemPrompt = ''
    let conversationHistory = []
    let isLoading = false
    let currentRestaurantId = null
    let tanoLimitReached = false
    let currentRestData = null
    let currentLang = 'es'

    // ─── Session management ──────────────────────────────────────────────────
    const SESSION_KEY = 'tano_session_' + (slug || '') + '_' + (mesa || '')
    const SESSION_MAX_MS = 4 * 60 * 60 * 1000 // 4 horas

    function sessionIsStale() {
      const ts = sessionStorage.getItem(SESSION_KEY)
      if (!ts) return false
      return (Date.now() - parseInt(ts, 10)) > SESSION_MAX_MS
    }

    function stampSession() {
      sessionStorage.setItem(SESSION_KEY, Date.now().toString())
    }

    window.newSession = function () {
      conversationHistory = []
      userMsgCount = 0
      tanoLimitReached = false
      stampSession()
      // Clear messages
      const messagesEl = document.getElementById('messages')
      const typing = document.getElementById('typing')
      Array.from(messagesEl.children).forEach(el => { if (el !== typing) el.remove() })
      // Hide waiter bar and tano limit alert
      document.getElementById('call-waiter-bar').style.display = 'none'
      document.getElementById('tano-limit-alert').style.display = 'none'
      if (currentRestData) addGreeting(currentRestData, currentLang)
    }

    // Auto-detectar idioma del navegador
    ;(function detectLang() {
      const nav = (navigator.language || 'es').toLowerCase().slice(0, 2)
      if (nav === 'en') currentLang = 'en'
      else if (nav === 'pt') currentLang = 'pt'
      else currentLang = 'es'
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang)
      })
    })()

    async function init() {
      if (!slug) { showError('Hmm, algo salió mal con este link. Pedile al mozo el QR de tu mesa y escanealo de nuevo.'); return }

      let rest
      try {
        rest = await restaurants.getBySlug(slug)
      } catch {
        showError('No se encontró el restaurante "' + slug + '".')
        return
      }

      currentRestaurantId = rest.id
      currentRestData = rest
      document.getElementById('loader-name').textContent = rest.name
      document.getElementById('rest-name').textContent = rest.name
      document.title = rest.name + ' · Tano'
      // Actualizar link de vuelta al menú con slug y mesa correctos
      const backBtn = document.getElementById('back-to-menu')
      if (backBtn) backBtn.href = 'menu.html?slug=' + slug + (mesa ? '&mesa=' + mesa : '')

      // Mostrar logo si existe
      if (rest.logo_url) {
        const logoEl = document.getElementById('rest-name')
        logoEl.insertAdjacentHTML('beforebegin',
          '<img src="' + rest.logo_url + '" alt="Logo" style="width:32px;height:32px;border-radius:6px;object-fit:contain;margin-bottom:4px;display:block">')
      }

      // Badge: mesa + estado del restaurante
      ;(function updateBadge() {
        const parts = []
        if (mesa) parts.push('Mesa ' + mesa)

        // Estado según horarios
        if (rest.opening_hours) {
          const now  = new Date()
          const day  = now.getDay()
          const hm   = now.getHours() * 100 + now.getMinutes()
          const raw  = rest.opening_hours[day]
          const toN  = s => { const [hh, mm] = s.split(':').map(Number); return hh*100+mm }
          if (!raw) {
            parts.push('🔴 Cerrado hoy')
          } else {
            const slots = Array.isArray(raw) ? raw : [raw]
            const isOpen = slots.some(s => hm >= toN(s.o) && hm < toN(s.c))
            const nextSlot = slots.find(s => hm < toN(s.o))
            if (isOpen) parts.push('🟢 Abierto')
            else if (nextSlot) parts.push('🕐 Abre a las ' + nextSlot.o)
            else parts.push('🔴 Cerrado')
          }
        } else {
          parts.push('Asistente activo')
        }

        document.getElementById('table-badge').innerHTML =
          '<span class="status-dot"></span>' + parts.join(' · ')
      })()

      systemPrompt = buildSystemPrompt(rest)
      buildSuggestions(rest)

      // Adaptar textos al tipo de negocio
      const subEl = document.getElementById('loading-sub-text')
      if (subEl) {
        const subTexts = {
          restaurant: 'Asistente de menú',
          local: 'Asistente de ventas',
          services: 'Agenda y consultas',
          ecommerce: 'Asistente de tienda',
        }
        subEl.textContent = subTexts[rest.business_type] || 'Asistente digital'
      }

      const inputEl = document.getElementById('chat-input')
      if (inputEl) {
        const placeholders = {
          restaurant: 'Preguntame sobre el menú...',
          local: 'Preguntame sobre productos o precios...',
          services: 'Consultá sobre turnos o servicios...',
          ecommerce: 'Preguntame sobre productos o envíos...',
        }
        inputEl.placeholder = placeholders[rest.business_type] || 'Preguntame lo que quieras...'
      }

      // Si la sesión es stale, arrancar limpio igual (ya conversationHistory = [])
      if (sessionIsStale()) {
        conversationHistory = []
      }
      stampSession()

      addGreeting(rest)

      // Mostrar botón de nueva sesión luego de cargar (para staff)
      document.getElementById('btn-new-session').style.display = 'block'

      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden')
      }, 1400)

      document.getElementById('chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendMessage()
      })

      // Revisar staleness en cada foco de la ventana
      window.addEventListener('focus', () => {
        if (sessionIsStale() && currentRestData) {
          newSession()
        }
      })
    }

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden')
      document.getElementById('error-msg').textContent = msg
      document.getElementById('error-screen').style.display = 'flex'
    }

    // ─── Menu text builder ────────────────────────────────────────────────────
    function buildMenuText(rest) {
      const cats = (rest.menu_categories || [])
        .filter(c => c.is_visible)
        .sort((a, b) => a.sort_order - b.sort_order)

      return cats.map(cat => {
        const items = (cat.menu_items || [])
          .filter(i => i.is_visible && i.is_available)
          .sort((a, b) => a.sort_order - b.sort_order)
        if (!items.length) return ''
        const lines = items.map(item => {
          const price = '$' + Number(item.price).toLocaleString('es-AR')
          const tags = (item.tags || []).map(t => TAG_LABELS[t]).filter(Boolean).join(', ')
          const star = item.is_featured ? '⭐ ' : ''
          return '- ' + star + item.name + ' (' + price + ')'
            + (item.description ? ': ' + item.description : '')
            + (tags ? '. ' + tags + '.' : '')
            + (item.is_featured ? ' [DESTACADO]' : '')
        }).join('\n')
        return (cat.emoji ? cat.emoji + ' ' : '') + cat.name.toUpperCase() + ':\n' + lines
      }).filter(Boolean).join('\n\n')
    }

    function buildFeaturedLine(rest) {
      const featured = (rest.menu_categories || []).flatMap(cat =>
        (cat.menu_items || []).filter(i => i.is_visible && i.is_available && i.is_featured)
      )
      if (!featured.length) return ''
      const names = featured.map(i => i.name).join(', ')
      return '\nPLATOS DESTACADOS (recomendá estos primero cuando te pregunten qué pedir): ' + names
    }

    function buildHoursText(hours) {
      if (!hours) return ''
      const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']
      const lines = DAYS.map((d, i) => {
        const raw = hours[i]
        if (!raw) return d + ': Cerrado'
        const slots = Array.isArray(raw) ? raw : [raw]
        return d + ': ' + slots.map(s => s.o + ' – ' + s.c).join(' y ')
      })
      return lines.join(' | ')
    }

    function buildSystemPrompt(rest) {
      const menuText = buildMenuText(rest)
      const featuredLine = buildFeaturedLine(rest)
      const location = [rest.address, rest.city].filter(Boolean).join(', ')
      const tone = rest.tano_tone || 'calido'
      const hoursLine = rest.opening_hours ? '\nHorarios: ' + buildHoursText(rest.opening_hours) : ''
      const socialLine = [
        rest.instagram_handle ? `Instagram: @${rest.instagram_handle}` : '',
        rest.facebook_url     ? `Facebook: ${rest.facebook_url}` : '',
        rest.website_url      ? `Web: ${rest.website_url}` : '',
      ].filter(Boolean).join(' · ')
      const socialPromptLine = socialLine ? '\nRedes y web: ' + socialLine : ''

      // Información de agenda/turnos si está configurada
      let agendaLine = ''
      if (rest.business_type === 'services' || rest.business_type === 'restaurant') {
        const hasAgenda = rest.business_type !== 'local' && rest.business_type !== 'ecommerce'
        if (hasAgenda) {
          if (rest.business_type === 'restaurant') {
            agendaLine = '\nRESERVAS: Los clientes pueden reservar mesa escribiendo por WhatsApp al número de reservas del restaurante. Podés informar sobre disponibilidad general pero no confirmás reservas desde este chat.'
          } else {
            agendaLine = '\nTURNOS: Los clientes pueden sacar turno escribiendo por WhatsApp al número de turnos del negocio. Podés informar que hay sistema de turnos disponible y dar el link de WhatsApp si te preguntan.'
          }
        }
      }

      const toneDesc = tone === 'sofisticado'
        ? 'Tu tono es elegante, sereno y sofisticado. Vocabulario cuidado, sin contracciones muy informales. Transmitís exclusividad sin sonar distante. Podés empezar una respuesta con "Claro que sí," o "Con mucho gusto." Sin emojis. Máximo 3 oraciones por respuesta.'
        : tone === 'neutro'
          ? 'Tu tono es amable y directo. Ni muy formal ni muy informal. Respondés en párrafos cortos, sin bullet points. Máximo 3 oraciones por respuesta. Podés usar algún emoji con moderación si queda natural.'
          : /* calido */ 'Tu tono es cálido, informal y porteño — como el mejor mozo del barrio que conoce el menú de memoria. Tratás al cliente de vos. Podés arrancar con "Mirá," o "Che," cuando es natural. Usás expresiones del Río de la Plata con moderación. Sin bullet points — hablás en párrafos cortos. Máximo 3 oraciones por respuesta. Un emoji si queda bien, no más.'

      const assistantName = rest.tano_name || (rest.business_type === 'services' ? 'el asistente' : rest.business_type === 'local' || rest.business_type === 'ecommerce' ? 'el asistente de ventas' : 'Tano')
      const assistantRole = rest.business_type === 'services'
        ? 'Ayudás a los clientes a conocer los servicios disponibles, los precios y los turnos. Podés informar si hay disponibilidad pero no confirmás turnos directamente — les decís que reserven por WhatsApp.'
        : rest.business_type === 'local' || rest.business_type === 'ecommerce'
        ? 'Ayudás a los clientes a conocer los productos disponibles, precios y cómo comprar. Sos amable, directo y conocés bien el catálogo.'
        : null

      const businessDesc = rest.business_type === 'services'
        ? 'un negocio de servicios en ' + (location || 'la zona')
        : rest.business_type === 'local' || rest.business_type === 'ecommerce'
        ? 'un local en ' + (location || 'la zona')
        : location ? 'un restaurante en ' + location : ''

      const catalogSection = (!menuText || menuText.length < 10) && assistantRole
        ? 'TIPO DE NEGOCIO: ' + (rest.business_type === 'services' ? 'Servicio de turnos/citas. ' + assistantRole : assistantRole)
        : 'MENÚ/CATÁLOGO DISPONIBLE:\n' + menuText

      return 'Sos ' + assistantName + ', el asistente digital de ' + rest.name
        + (businessDesc ? ', ' + businessDesc : '') + '.'
        + hoursLine
        + socialPromptLine
        + '\n\n'
        + toneDesc + '\n\n'
        + (LANG_INSTRUCTION[currentLang] ? LANG_INSTRUCTION[currentLang] + '\n\n' : '')
        + 'REGLAS FUNDAMENTALES:\n'
        + '1. NUNCA empezás una respuesta con "¡Claro!", "¡Por supuesto!", "¡Excelente elección!" ni ninguna exclamación de ese tipo — suenan a bot y están prohibidas.\n'
        + '2. NUNCA usás bullet points ni listas numeradas en tus respuestas. Hablás en párrafos cortos y naturales.\n'
        + '3. Máximo 3 oraciones por respuesta. Los comensales están en el restaurante, no leen paredes de texto.\n'
        + '4. Si recomendás algo, das UNA sola recomendación con una razón concreta y específica (no "es muy rica" sino "tiene brie y manchego con mermelada de higo").\n'
        + '5. Solo hablás sobre el menú, los productos, el negocio y cómo podés ayudar.\n'
        + '6. Si te preguntan algo ajeno al menú o al negocio, decí: "Eso mejor preguntale directamente al equipo — yo me manejo con el menú."\n'
        + '7. Nunca inventés precios, ingredientes ni disponibilidad. Si no lo tenés en el menú, decís que consulten al equipo.\n'
        + '8. Podés ofrecer agregar al pedido: "¿Lo sumo al pedido?" — usalo cuando tenga sentido, no en cada respuesta.\n'
        + '9. Si hay ingredientes que podrían ser alérgenos y el cliente pregunta, dás la info clara y directa.\n\n'
        + 'ACCIONES SOBRE EL PEDIDO (marcadores que el cliente NO ve — el sistema los procesa):\n'
        + '- Si el cliente pide agregar un plato que SÍ está en el menú, confirmalo natural y terminá tu mensaje con una línea aparte EXACTA por cada plato: [[AGREGAR|nombre exacto del plato tal como figura en el menú|cantidad]]\n'
        + '- NUNCA digas que agregaste algo sin poner su línea [[AGREGAR|...]] — sin esa línea el plato NO se agrega de verdad.\n'
        + '- Si pide un plato que NO está en el menú, decíselo con amabilidad, sugerí lo más parecido que sí tengas, y terminá el mensaje con la línea: [[NO_DISPONIBLE]]\n'
        + '- Los marcadores van al final del mensaje, cada uno en su propia línea.\n\n'
        + featuredLine
        + agendaLine + '\n\n'
        + catalogSection
    }

    function buildSuggestions(rest) {
      const btype = rest.business_type || 'restaurant'
      const menuLink = 'menu.html?slug=' + encodeURIComponent(rest.slug) + (mesa ? '&mesa=' + mesa : '')
      const el = document.getElementById('suggestions')

      const hasFeatured = btype === 'restaurant' && (rest.menu_categories || []).some(cat =>
        (cat.menu_items || []).some(i => i.is_visible && i.is_available && i.is_featured)
      )

      let suggestions = ''

      if (btype === 'restaurant') {
        const cats = (rest.menu_categories || []).filter(c => c.is_visible).sort((a,b) => a.sort_order - b.sort_order).slice(0, 3)
        suggestions =
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué me recomendás para hoy?\')">✨ ¿Qué me recomendás?</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'Quiero algo vegetariano\')">🌿 Vegetariano</button>' +
          (hasFeatured ? '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cuáles son los platos destacados?\')">⭐ Destacados</button>' : '') +
          cats.map(cat => '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué ' + cat.name.toLowerCase() + ' tienen?\')">' + (cat.emoji ? cat.emoji + ' ' : '') + cat.name + '</button>').join('') +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Tienen opciones sin TACC?\')">🌾 Sin TACC</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cuánto tarda el pedido?\')">⏱ Tiempo de espera</button>' +
          '<a class="suggestion-btn" href="' + menuLink + '" style="text-decoration:none;display:inline-flex;align-items:center">📋 Ver menú</a>'
      } else if (btype === 'services') {
        suggestions =
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué servicios ofrecen?\')">💆 Ver servicios</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Tienen turnos disponibles para hoy?\')">📅 Turnos hoy</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cuánto dura y cuánto sale un corte?\')">💈 Precios</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cómo puedo sacar un turno?\')">✅ Sacar turno</button>'
      } else if (btype === 'local') {
        suggestions =
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué productos tienen?\')">🏪 Ver productos</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Tienen stock disponible?\')">📦 Stock</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Hacen envíos?\')">🚚 Envíos</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cuáles son los precios?\')">💰 Precios</button>'
      } else if (btype === 'ecommerce') {
        suggestions =
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Qué productos tienen?\')">📦 Catálogo</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Publican en MercadoLibre?\')">🛒 MercadoLibre</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Cómo hago un pedido?\')">✅ Hacer pedido</button>' +
          '<button class="suggestion-btn" onclick="window.sendSuggestion(\'¿Hacen envíos a todo el país?\')">🚚 Envíos</button>'
      }

      el.innerHTML = suggestions
    }

    const LANG_GREETINGS = {
      en: name => `Hello! Welcome to ${name} 👋 How can we help you? I can tell you about dishes, ingredients, vegetarian, vegan or gluten-free options, and give recommendations.`,
      pt: name => `Olá! Bem-vindo ao ${name} 👋 Em que posso ajudar? Posso falar sobre pratos, ingredientes, opções vegetarianas, veganas ou sem glúten, e dar recomendações.`,
      es: name => null, // usa tano_welcome o default en español
    }

    const LANG_INSTRUCTION = {
      en: 'IMPORTANT: The customer is writing in English. Always respond in English regardless of what language the menu items are written in.',
      pt: 'IMPORTANTE: O cliente está escrevendo em português. Sempre responda em português, independentemente do idioma dos itens do menu.',
      es: '',
    }

    function addGreeting(rest, lang = currentLang) {
      // Verificar si está cerrado ahora
      let closedNote = ''
      if (rest.opening_hours) {
        const now = new Date()
        const day = now.getDay()
        const hm  = now.getHours() * 100 + now.getMinutes()
        const toN = s => { const [hh,mm] = s.split(':').map(Number); return hh*100+mm }
        const h   = rest.opening_hours[day]
        if (!h || hm < toN(h.o) || hm >= toN(h.c)) {
          closedNote = ' (Estamos cerrados ahora, pero te respondo igual 😊)'
        }
      }

      let msg
      if (lang !== 'es') {
        msg = LANG_GREETINGS[lang](rest.name)
      } else {
        msg = rest.tano_welcome?.trim()
          || '¡Hola! Bienvenido a ' + rest.name + ' 👋 '
            + '¿En qué te puedo ayudar? Te cuento sobre los platos, ingredientes, opciones vegetarianas, veganas o sin TACC, y te hago recomendaciones.'
      }
      if (typeof msg === 'string') msg += closedNote
      addMessage('assistant', msg)
    }

    window.setLang = function (lang) {
      if (lang === currentLang || !currentRestData) return
      currentLang = lang

      // Actualizar botones
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang)
      })

      // Regenerar system prompt con nuevo idioma
      systemPrompt = buildSystemPrompt(currentRestData)

      // Limpiar conversación y saludar de nuevo
      conversationHistory = []
      const messagesEl = document.getElementById('messages')
      const typing = document.getElementById('typing')
      // Mantener solo el typing indicator
      Array.from(messagesEl.children).forEach(el => {
        if (el !== typing) el.remove()
      })
      addGreeting(currentRestData, lang)
    }

    // ─── Chat ─────────────────────────────────────────────────────────────────
    function addMessage(role, text) {
      const messages = document.getElementById('messages')
      const typing = document.getElementById('typing')
      const div = document.createElement('div')
      div.className = 'msg ' + (role === 'user' ? 'user' : 'bot')
      const timeStr = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
      if (role === 'assistant') {
        div.innerHTML = '<div class="msg-label">Asistente</div><div class="msg-bubble">' + text.replace(/\n/g, '<br>') + '</div><div style="font-size:10px;color:#3a2e18;padding:2px 4px;margin-top:2px">' + timeStr + '</div>'
      } else {
        div.innerHTML = '<div class="msg-bubble">' + text + '</div><div style="font-size:10px;color:rgba(26,18,8,.5);padding:2px 4px;margin-top:2px;text-align:right">' + timeStr + '</div>'
      }
      messages.insertBefore(div, typing)
      messages.scrollTop = messages.scrollHeight
    }

    function showTyping(show) {
      document.getElementById('typing').style.display = show ? 'flex' : 'none'
      if (show) {
        const messages = document.getElementById('messages')
        messages.scrollTop = messages.scrollHeight
      }
    }

    // Llamar al mozo — counter (definido antes de sendMessage que lo usa)
    const CALL_WAITER_AFTER_MSGS = 3
    let userMsgCount = 0
    function maybeShowCallWaiter() {
      userMsgCount++
      if (userMsgCount >= CALL_WAITER_AFTER_MSGS) {
        document.getElementById('call-waiter-bar').style.display = 'block'
      }
    }

    // ── Acciones de Tano sobre el pedido ─────────────────────────────────────
    // Tano emite marcadores [[AGREGAR|nombre|cant]] y [[NO_DISPONIBLE]] que acá
    // se convierten en acciones reales: escribir el carrito compartido (misma
    // clave localStorage que menu.html) y registrar experiencia con problemas
    // (para no invitar a reseñar en Google si faltó un plato).
    function cartKeyMozo() { return 'vt_cart_' + (slug || 'demo') + '_' + (mesa || '0') }
    function normalizarNombre(s) {
      return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim()
    }
    function procesarAccionesTano(reply) {
      let visible = reply
      const pedidos = []
      visible = visible.replace(/\[\[AGREGAR\|([^|\]]+)\|(\d+)\]\]/g, (_, nombre, cant) => {
        pedidos.push({ nombre: nombre.trim(), cant: Math.max(1, parseInt(cant) || 1) })
        return ''
      })
      const noDisponible = /\[\[NO_DISPONIBLE\]\]/.test(visible)
      visible = visible.replace(/\[\[NO_DISPONIBLE\]\]/g, '')
      if (noDisponible) {
        try { sessionStorage.setItem('vitrina_exp_mala', '1') } catch {}
      }
      const agregados = [], noEncontrados = []
      if (pedidos.length) {
        const items = ((currentRestData || {}).menu_categories || []).flatMap(c => c.menu_items || []).filter(i => i.is_visible !== false)
        let cart = {}
        try { cart = JSON.parse(localStorage.getItem(cartKeyMozo()) || '{}') } catch {}
        for (const p of pedidos) {
          const buscado = normalizarNombre(p.nombre)
          const item = items.find(i => normalizarNombre(i.name) === buscado)
            || items.find(i => normalizarNombre(i.name).includes(buscado) || buscado.includes(normalizarNombre(i.name)))
          if (item) {
            cart[item.id] = (cart[item.id] || 0) + p.cant
            agregados.push(p.cant + '× ' + item.name)
          } else {
            noEncontrados.push(p.nombre)
          }
        }
        if (agregados.length) {
          try {
            localStorage.setItem(cartKeyMozo(), JSON.stringify(cart))
            localStorage.setItem(cartKeyMozo() + '_ts', Date.now())
          } catch {}
        }
      }
      return { visible: visible.replace(/\n{3,}/g, '\n\n').trim(), agregados, noEncontrados }
    }

    async function sendMessage() {
      if (isLoading) return
      const input = document.getElementById('chat-input')
      const text = input.value.trim()
      if (!text) return

      input.value = ''
      document.getElementById('suggestions').style.display = 'none'
      addMessage('user', text)
      conversationHistory.push({ role: 'user', content: text })
      maybeShowCallWaiter()
      isLoading = true
      showTyping(true)

      const errorEl = document.getElementById('api-error')
      errorEl.style.display = 'none'

      // Si ya llegó al límite, responder sin llamar a la API
      if (tanoLimitReached) {
        showTyping(false)
        addMessage('assistant', 'Por ahora no puedo seguir respondiendo. Llegué al límite de mensajes del mes, el equipo del restaurante te atiende con gusto 😊')
        isLoading = false
        return
      }

      // Fase 1 — SOLO la llamada de red se reintenta. Antes el retry envolvía
      // también el procesamiento de la respuesta: si procesar tiraba un error
      // DESPUÉS de pushear el assistant al historial, se reenviaba un historial
      // terminado en assistant → Anthropic lo toma como prefill completo →
      // content vacío → "No pude procesar tu consulta".
      let data = null
      let attempts = 0
      while (attempts < 3) {
        try {
          const res = await fetch(BACKEND + '/api/claude', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system: systemPrompt,
              messages: conversationHistory,
              max_tokens: 1000,
              restaurantId: currentRestaurantId,
              assistantType: 'tano',
            })
          })

          if (res.status === 529) {
            attempts++
            if (attempts < 3) {
              errorEl.style.display = 'block'
              errorEl.textContent = 'Servidor ocupado, reintentando (' + attempts + '/3)...'
              await new Promise(r => setTimeout(r, 3000))
              continue
            }
          }

          if (!res.ok) throw new Error('Error ' + res.status)
          data = await res.json()
          break
        } catch {
          attempts++
          if (attempts >= 3) break
          await new Promise(r => setTimeout(r, 3000))
        }
      }

      if (!data || !data.content?.[0]?.text) {
        showTyping(false)
        addMessage('assistant', 'Ups, tuve un problema técnico. ¿Podés intentarlo de nuevo?')
        // No dejar el user colgado en el historial sin respuesta: lo sacamos para
        // que el próximo envío arranque consistente (user al final = historial válido).
        if (conversationHistory[conversationHistory.length - 1]?.role === 'user') conversationHistory.pop()
        isLoading = false
        return
      }

      // Fase 2 — procesar la respuesta. Un error acá NUNCA debe reenviar la API.
      if (data.tano_limit_reached) {
        tanoLimitReached = true
        document.getElementById('chat-input').disabled = true
        document.querySelector('.send-btn').disabled = true
      }
      if (data.tano_remaining !== undefined && data.tano_remaining <= 15 && data.tano_remaining > 0) {
        const alertEl = document.getElementById('tano-limit-alert')
        if (alertEl) {
          alertEl.style.display = 'block'
          alertEl.textContent = `⚠️ Quedan ${data.tano_remaining} respuestas disponibles este mes.`
        }
      }

      const reply = data.content[0].text
      conversationHistory.push({ role: 'assistant', content: reply })
      showTyping(false)
      let acc = { visible: reply, agregados: [], noEncontrados: [] }
      try { acc = procesarAccionesTano(reply) } catch (e) { console.error('procesarAccionesTano:', e) }
      addMessage('assistant', acc.visible || reply)
      if (acc.agregados.length) addMessage('assistant', '🛒 Listo — agregué al pedido: ' + acc.agregados.join(', ') + '. Lo ves al volver al menú 👈')
      if (acc.noEncontrados.length) addMessage('assistant', 'Ojo: "' + acc.noEncontrados.join('", "') + '" no lo pude sumar solo — agregalo tocándolo en el menú 🙏')
      errorEl.style.display = 'none'

      isLoading = false
    }

    window.sendMessage = sendMessage
    window.sendSuggestion = function(text) {
      document.getElementById('chat-input').value = text
      sendMessage()
    }

    window.callWaiter = function () {
      // Si el restaurante tiene teléfono, abrir WhatsApp; si no, solo mostrar mensaje
      const btn = document.getElementById('call-waiter-btn')
      const phone = currentRestData?.phone?.replace(/\D/g, '')
      if (phone) {
        const waUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(
          (mesa ? 'Mesa ' + mesa + ': ' : '') + 'Hola, necesito ayuda con mi pedido.'
        )
        window.open(waUrl, '_blank')
      } else {
        // Sin teléfono: mostrar mensaje en el chat y ocultar el botón
        addMessage('assistant', '🙋 ¡Perfecto! Levantá la mano y un mozo se acerca enseguida.')
        document.getElementById('call-waiter-bar').style.display = 'none'
      }
    }

    init()
  </script>
</body>
