<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · Vitrina</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #FAF7F2; color: #1C1208; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { text-align: center; max-width: 480px; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 48px; text-decoration: none; }
    .logo-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: #B85A30; }
    .number { font-family: 'Cormorant Garamond', serif; font-size: 120px; font-weight: 500; color: #F4E8DF; line-height: 1; margin-bottom: 8px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; margin-bottom: 12px; }
    p { font-size: 15px; color: #8A7A6A; margin-bottom: 32px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { padding: 12px 24px; background: #B85A30; color: white; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 600; transition: background .15s; }
    .btn-primary:hover { background: #9A4827; }
    .btn-secondary { padding: 12px 24px; background: none; color: #8A7A6A; border: 1.5px solid #E8DDD0; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; transition: all .15s; }
    .btn-secondary:hover { border-color: #B85A30; color: #B85A30; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="logo">
      <svg width="22" height="27" viewBox="0 0 18 22" fill="none">
        <rect x="0" y="18" width="18" height="2.5" rx="1.2" fill="#B85A30"/>
        <rect x="0" y="8" width="2.5" height="12" rx="1.2" fill="#B85A30"/>
        <rect x="15.5" y="8" width="2.5" height="12" rx="1.2" fill="#B85A30"/>
        <path d="M2.5 8 Q9 1 15.5 8" stroke="#B85A30" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Vitrina</span>
    </a>
    <div class="number">404</div>
    <h1>Esta página no existe</h1>
    <p>El link que seguiste no lleva a ningún lado. Puede que haya expirado o esté mal escrito.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Ir al inicio</a>
      <a href="/panel.html" class="btn-secondary">Mi panel →</a>
    </div>
  </div>
</body>
</html>
