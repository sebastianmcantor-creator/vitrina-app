<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocina · Pedidos</title>
  <link rel="stylesheet" href="lib/vitrina-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; font-family: 'DM Sans', sans-serif; color: #f0f0f0; min-height: 100vh; }

    #loading-screen, #login-screen, #error-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 20px; text-align: center; color: #666;
    }

    .login-title { font-size: 22px; font-weight: 600; color: #f0f0f0; }
    .login-sub { font-size: 14px; color: #666; }
    .google-btn {
      display: flex; align-items: center; gap: 10px;
      background: #fff; color: #1a1208; border: none; border-radius: 10px;
      padding: 12px 22px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      font-weight: 500; cursor: pointer; margin-top: 8px;
    }
    .google-btn:hover { background: #f5f5f5; }

    #main-view { display: none; }

    .header {
      background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      padding: 16px 24px; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-sub { font-size: 12px; color: #666; margin-top: 2px; }
    .conn-label { font-size: 12px; color: #888; display: flex; align-items: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; display: inline-block; margin-right: 6px; }
    .status-dot.connected { background: #44cc66; }

    .boards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px; padding: 24px;
    }

    .pedido-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; overflow: hidden; animation: slideIn 0.3s ease; transition: border-color 0.2s; }
    .pedido-card:hover:not(.status-ready) { border-color: #3a3a3a; }
    .pedido-card.status-ready { border-color: #1a4a2a; opacity: 0.6; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pedido-header {
      background: #222; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }
    .mesa-label { font-size: 16px; font-weight: 600; }
    .pedido-hora { font-size: 12px; color: #888; }
    .pedido-id { font-size: 11px; color: #555; }

    .pedido-items { padding: 14px 16px; }
    .pedido-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #1e1e1e; font-size: 15px;
    }
    .pedido-item:last-child { border-bottom: none; }
    .item-qty { color: #c8a84a; font-weight: 700; margin-right: 10px; font-size: 18px; min-width: 28px; }
    .item-name-cocina { flex: 1; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }

    .pedido-footer { padding: 12px 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; }
    .estado-btn { flex: 1; border: none; border-radius: 10px; padding: 10px; min-height: 48px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
    .estado-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .estado-btn:active:not(:disabled) { transform: translateY(0); }
    .estado-btn.pending, .estado-btn.confirmed { background: #c8a84a; color: #0f0f0f; box-shadow: 0 2px 8px rgba(200,168,74,0.3); }
    .estado-btn.preparing { background: #2255cc; color: white; box-shadow: 0 2px 8px rgba(34,85,204,0.3); }
    .estado-btn.ready { background: #22aa44; color: white; box-shadow: 0 2px 8px rgba(34,170,68,0.3); }
    .estado-btn:disabled { opacity: 0.4; cursor: default; }

    .estado-badge { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 600; letter-spacing: 0.02em; }
    .badge-pending, .badge-confirmed { background: #3a2e00; color: #c8a84a; }
    .badge-preparing { background: #001a44; color: #6699ff; }
    .badge-ready { background: #002211; color: #44cc66; }

    .card-undo-btn {
      flex-shrink: 0; background: #2a2a2a; border: 1px solid #3a3a3a;
      border-radius: 10px; padding: 10px 13px; font-size: 16px; line-height: 1;
      cursor: pointer; color: #888; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .card-undo-btn:hover { background: #333; border-color: #c8a84a; color: #c8a84a; }

    .nuevo-badge {
      background: #c8553d; color: white; font-size: 10px;
      padding: 2px 6px; border-radius: 6px; margin-left: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .empty-state {
      text-align: center; color: #444; padding: 80px 20px;
      font-size: 15px; grid-column: 1 / -1;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 8px; padding: 12px 24px 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 20px; padding: 6px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; color: #888; cursor: pointer; transition: all .15s;
    }
    .filter-tab.active { background: #c8a84a20; border-color: #c8a84a; color: #c8a84a; font-weight: 600; }
    .filter-tab:hover:not(.active) { border-color: #444; color: #ccc; }
    .filter-count {
      display: inline-block; background: #c8553d; color: #fff;
      border-radius: 10px; font-size: 10px; padding: 1px 6px; margin-left: 4px;
    }

    /* Elapsed time */
    .elapsed { font-size: 11px; margin-top:2px; }
    .elapsed.ok { color: #888; }
    .elapsed.warn { color: #e8a844; }
    .elapsed.danger { color: #e84444; font-weight: 600; }

    /* Mesa action */
    .mesa-listo-btn {
      background: #22aa4420; border: 1px solid #22aa4440; color: #44cc66;
      border-radius: 8px; padding: 3px 10px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background .15s;
    }
    .mesa-listo-btn:hover { background: #22aa4440; }

    /* Agrupación por mesa */
    .mesa-group {
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; gap: 0;
    }
    .mesa-group-header { background: linear-gradient(135deg, #1e1e1e 0%, #242424 100%); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
    .mesa-group-title { font-size: 22px; font-weight: 700; color: #f0f0f0; letter-spacing: -0.01em; }
    .mesa-group-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; }
    .mesa-order-count {
      background: #c8a84a20; color: #c8a84a;
      padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
    }
    .mesa-group .pedido-card {
      border-radius: 0; border: none; border-top: 1px solid #222;
      animation: none;
    }
    .mesa-group .pedido-card:first-of-type { border-top: none; }
    .mesa-group .pedido-header { background: #1a1a1a; }
    .pedido-num { font-size: 12px; color: #888; font-weight: 400; }
    @media (max-width: 480px) {
      .header { padding: 12px 16px; }
      .header-title { font-size: 16px; }
      .boards { padding: 12px; gap: 12px; }
      .filter-bar { padding: 8px 12px 0; gap: 6px; }
      .filter-tab { padding: 5px 12px; font-size: 12px; }
    }
    /* Cronómetro semáforo */
    .pedido-timer {
      font-size: 20px; font-weight: 700; font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.02em; padding: 8px 16px;
      border-top: 1px solid #2a2a2a;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pedido-timer.green  { color: #44cc66; background: rgba(68,204,102,0.06); }
    .pedido-timer.yellow { color: #e8a844; background: rgba(232,168,68,0.08); }
    .pedido-timer.red    { color: #e84444; background: rgba(232,68,68,0.08); }
    .pedido-timer.red-pulse {
      color: #e84444; background: rgba(232,68,68,0.12);
      animation: timerPulse 1s ease-in-out infinite;
    }
    @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    @media print {
      body { background: white; color: black; }
      .filter-bar, .header .conn-label, #btn-mute-sound { display: none !important; }
      .boards { grid-template-columns: repeat(2, 1fr); padding: 8px; gap: 8px; }
      .mesa-group { border: 1px solid #ccc; break-inside: avoid; }
      .mesa-group-header { background: #f5f5f5 !important; color: black !important; }
      .pedido-card { background: white !important; border: 1px solid #ddd !important; }
      .estado-btn, .card-undo-btn { display: none !important; }
      .item-qty { color: #333 !important; }
      .item-name-cocina { color: black !important; }
      .estado-badge { border: 1px solid #ccc; background: white !important; color: black !important; }
      .nuevo-badge { background: #333 !important; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<div id="loading-screen">Cargando…</div>

<div id="login-screen" style="display:none">
  <div style="font-size:48px">🍳</div>
  <div class="login-title">Panel de cocina</div>
  <div class="login-sub">Ingresá para ver los pedidos en tiempo real</div>
  <button class="google-btn" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
    Entrar con Google
  </button>
  <div style="font-size:12px;color:#444;margin-top:8px">¿Es la primera vez? Probá la demo desde vitrinaapp.com.ar</div>
</div>

<div id="error-screen" style="display:none">
  <div style="font-size:48px">😕</div>
  <div id="error-msg" style="color:#f0f0f0;font-size:16px"></div>
</div>

<div id="main-view">
  <div class="header">
    <div>
      <div class="header-title">🍳 Panel de Cocina</div>
      <div class="header-sub" id="rest-sub">Cargando…</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="btn-mute-sound" onclick="toggleMuteSound()" title="Silenciar alertas"
        style="background:none;border:1px solid #3a3a3a;color:#888;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif"
        onmouseover="this.style.borderColor='#c8a84a';this.style.color='#c8a84a'"
        onmouseout="if(!soundMuted){this.style.borderColor='#3a3a3a';this.style.color='#888'}">
        🔔 Alertas activas
      </button>
      <div class="conn-label" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-dot" id="status-dot"></span>
        <span id="conn-label">Conectando...</span>
      </div>
    </div>
  </div>
  <div class="filter-bar" id="filter-bar" role="tablist" aria-label="Estado de pedidos">
    <button class="filter-tab active" data-filter="active" onclick="setFilter('active')" role="tab" aria-selected="true">
      Nuevos <span class="filter-count" id="fc-active" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')" role="tab" aria-selected="false">
      Pendientes <span class="filter-count" id="fc-pending" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="preparing" onclick="setFilter('preparing')" role="tab" aria-selected="false">
      En preparación <span class="filter-count" id="fc-preparing" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="ready" onclick="setFilter('ready')" role="tab" aria-selected="false">
      Listos para entregar <span class="filter-count" id="fc-ready" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="all" onclick="setFilter('all')" role="tab" aria-selected="false">
      Historial
    </button>
  </div>
  <div class="boards" id="boards" aria-live="polite">
    <div class="empty-state">
      <div class="empty-icon">🍽️</div>
      Todo listo. Los pedidos nuevos aparecen acá automáticamente.
    </div>
  </div>
</div>

<!-- Modal cobro de mesa — SOLO restaurant -->
<div id="cobro-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:20px">
  <div style="background:#1a1a1a;border:1px solid #3a3a3a;border-radius:16px;padding:24px;max-width:360px;width:100%">
    <div style="font-size:18px;font-weight:600;color:#f0f0f0;margin-bottom:6px" id="cobro-title">Mesa X · Cobrar</div>
    <div style="font-size:13px;color:#888;margin-bottom:16px" id="cobro-desglose">Cargando...</div>
    <div style="font-size:28px;font-weight:700;color:#c8a84a;margin-bottom:20px" id="cobro-total">$0</div>
    <button id="cobro-btn-generar" onclick="generarPagoMesa()"
      style="width:100%;background:#22aa44;color:white;border:none;border-radius:10px;padding:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px">
      💳 Generar link de pago
    </button>
    <button onclick="document.getElementById('cobro-modal').style.display='none'"
      style="width:100%;background:none;border:1px solid #3a3a3a;border-radius:10px;padding:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:#888;cursor:pointer">
      Cancelar
    </button>
  </div>
</div>

<script type="module">
  import { supabase } from './lib/supabase.js'
  import { restaurants, orders } from './lib/db.js'

  const params = new URLSearchParams(location.search)
  const slug = params.get('slug')

  let rest = null
  let pedidos = {}
  let historial = {}
  let realtimeChannel = null
  let currentFilter = 'active' // all | active | pending | preparing | ready
  let elapsedTimer = null
  let soundMuted = localStorage.getItem('cocina_muted') === '1'
  function toggleMuteSound() {
    soundMuted = !soundMuted
    localStorage.setItem('cocina_muted', soundMuted ? '1' : '0')
    const btn = document.getElementById('btn-mute-sound')
    if (btn) {
      btn.textContent = soundMuted ? '🔕 Alertas silenciadas' : '🔔 Alertas activas'
      btn.style.borderColor = soundMuted ? '#c8553d' : '#3a3a3a'
      btn.style.color = soundMuted ? '#c8553d' : '#888'
    }
  }
  window.toggleMuteSound = toggleMuteSound

  // ── Auth ──────────────────────────────────────────────────────────────────────
  // Modo demo: las cocinas de los restaurantes de demostración se pueden ver sin
  // login (solo slugs de demo — las cocinas reales siguen requiriendo sesión).
  const DEMO_SLUGS = ['somma']
  const esDemo = !!slug && (slug.startsWith('demo-') || DEMO_SLUGS.includes(slug))
  async function init() {
    if (esDemo) { await startKitchen(); return }
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) {
      show('login-screen')
      return
    }
    await startKitchen()
  }

  async function startKitchen() {
    if (!slug) { show('login-screen'); return }
    try {
      rest = await restaurants.getBySlug(slug)
    } catch {
      showError('No se encontró el restaurante "' + slug + '".')
      return
    }
    document.getElementById('rest-sub').textContent = rest.name + ' · Pedidos en tiempo real'
    show('main-view')
    await fetchPedidos()
    suscribirRealtime()
    requestWakeLock()

    // Restaurar estado del botón de sonido
    ;(function initSoundBtn() {
      const btn = document.getElementById('btn-mute-sound')
      if (btn && soundMuted) {
        btn.textContent = '🔕 Alertas silenciadas'
        btn.style.borderColor = '#c8553d'
        btn.style.color = '#c8553d'
      }
    })()
  }

  window.loginGoogle = async function () {
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.href },
    })
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (esDemo) return // el modo demo no depende de la sesión
    if (session && !rest) {
      startKitchen()
      return
    }
    if (!session) {
      if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null }
      if (rest) {
        // Sesión expirada durante uso activo — resetear y mostrar login sin recargar
        rest = null; pedidos = {}; historial = {}
        show('login-screen')
      }
    }
  })

  // Wake Lock — pantalla no se duerme en cocina
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return
    try {
      window._wakeLock = await navigator.wakeLock.request('screen')
      window._wakeLock.addEventListener('release', () => {
        setTimeout(requestWakeLock, 1000)
      })
    } catch (e) { /* navegador rechazó, no es crítico */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock()
  })

  window.addEventListener('beforeunload', () => {
    if (realtimeChannel) supabase.removeChannel(realtimeChannel)
  })

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function show(id) {
    ['loading-screen','login-screen','error-screen','main-view'].forEach(s => {
      document.getElementById(s).style.display = s === id ? (id === 'main-view' ? 'block' : 'flex') : 'none'
    })
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    show('error-screen')
  }

  function setStatus(online) {
    document.getElementById('status-dot').classList.toggle('connected', online)
    document.getElementById('conn-label').textContent = online ? 'En línea' : 'Sin conexión'
  }

  // ── Carga inicial ─────────────────────────────────────────────────────────────
  async function fetchPedidos() {
    try {
      const lista = await orders.listActive(rest.id)
      const nuevos = lista.filter(p => !pedidos[p.id] && (p.status === 'pending' || p.status === 'confirmed'))
      if (nuevos.length > 0) playSound()
      pedidos = {}
      lista.forEach(p => { pedidos[p.id] = p })
      setStatus(true)
      renderAll()
    } catch {
      setStatus(false)
    }
  }

  // ── Realtime ──────────────────────────────────────────────────────────────────
  function suscribirRealtime() {
    if (realtimeChannel) supabase.removeChannel(realtimeChannel)

    realtimeChannel = supabase
      .channel('cocina-' + rest.id)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'orders',
        filter: 'restaurant_id=eq.' + rest.id,
      }, async payload => {
        const order = payload.new
        if (!order) return

        if (payload.eventType === 'DELETE' || order.status === 'delivered' || order.status === 'cancelled') {
          delete pedidos[order.id]
          renderAll()
          return
        }

        // Pago confirmado (paid_at recién seteado) — toast + chip "Pagado".
        // OJO: pagar NO es entregar. El pedido SIGUE en su columna y la cocina
        // lo avanza normalmente hasta Entregado (aviso WhatsApp y reseña incluidos).
        if (order.paid_at && pedidos[order.id] && !pedidos[order.id].paid_at) {
          const mesa = pedidos[order.id]?.table_number
          const mesaStr = mesa != null ? 'Mesa ' + mesa : 'Pedido'
          pedidos[order.id] = { ...pedidos[order.id], ...order }
          renderAll()
          // Toast de confirmación de pago
          const toastMsg = '💳 ' + mesaStr + ' · Pago confirmado'
          const toast = document.createElement('div')
          toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#22aa44;color:white;padding:12px 24px;border-radius:12px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;z-index:999;box-shadow:0 4px 20px rgba(34,170,68,.4);animation:slideIn .3s ease'
          toast.textContent = toastMsg
          document.body.appendChild(toast)
          setTimeout(() => {
            toast.style.opacity = '0'
            toast.style.transition = 'opacity .4s'
            setTimeout(() => toast.remove(), 400)
          }, 5000)
          return
        }

        // Para INSERT necesitamos los order_items — hacemos fetch puntual
        if (payload.eventType === 'INSERT') {
          try {
            const { data } = await supabase
              .from('orders')
              .select('*, order_items(*)')
              .eq('id', order.id)
              .single()
            if (data) {
              const esNuevo = !pedidos[data.id]
              pedidos[data.id] = data
              if (esNuevo) playSound()
            }
          } catch {}
        } else {
          // UPDATE: actualizar solo los campos del order, conservar order_items
          if (pedidos[order.id]) {
            pedidos[order.id] = { ...pedidos[order.id], ...order }
          }
        }
        renderAll()
        setStatus(true)
      })
      .subscribe(status => {
        setStatus(status === 'SUBSCRIBED')
      })
  }

  // ── Sound ─────────────────────────────────────────────────────────────────────
  function playSound() {
    if (soundMuted) return
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)()
      // Melodía corta: Do-Mi-Sol (más agradable que el beep anterior)
      const notes = [
        { freq: 523.25, start: 0,    dur: 0.15 }, // Do5
        { freq: 659.25, start: 0.12, dur: 0.15 }, // Mi5
        { freq: 783.99, start: 0.24, dur: 0.25 }, // Sol5
        { freq: 1046.5, start: 0.36, dur: 0.3  }, // Do6
      ]
      notes.forEach(n => {
        const osc  = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.connect(gain); gain.connect(ctx.destination)
        osc.frequency.value = n.freq
        osc.type = 'sine'
        gain.gain.setValueAtTime(0, ctx.currentTime + n.start)
        gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + n.start + 0.02)
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur)
        osc.start(ctx.currentTime + n.start)
        osc.stop(ctx.currentTime + n.start + n.dur)
      })
    } catch {}
  }

  // ── State transitions ─────────────────────────────────────────────────────────
  function siguienteEstado(status) {
    if (status === 'pending' || status === 'confirmed') return 'preparing'
    if (status === 'preparing') return 'ready'
    return 'delivered'
  }

  function labelBtn(status) {
    if (status === 'pending' || status === 'confirmed') return '▶ Empezar a preparar'
    if (status === 'preparing') return '✓ Marcar como listo'
    return '✓ Marcar entregado'
  }

  const _pendingConfirm = {}

  async function cambiarEstado(id) {
    const pedido = pedidos[id]
    if (!pedido || pedido.status === 'delivered') return
    const anterior = pedido.status
    const siguiente = siguienteEstado(anterior)
    const cardId = 'card-' + id.replace(/-/g,'_')
    const btn = document.querySelector('#' + cardId + ' .estado-btn')

    // Doble tap para confirmar "Listo" — evita falsos positivos
    if (siguiente === 'ready' && !_pendingConfirm[id]) {
      _pendingConfirm[id] = true
      if (btn) {
        btn.textContent = '✓ ¿Confirmar listo?'
        btn.style.background = '#22aa44'
        btn.style.color = 'white'
        btn.style.animation = 'pulse .4s ease-in-out 2'
      }
      setTimeout(() => {
        if (_pendingConfirm[id]) {
          delete _pendingConfirm[id]
          renderAll()
        }
      }, 2500)
      return
    }
    delete _pendingConfirm[id]

    if (btn) btn.disabled = true

    try {
      const updated = await orders.updateStatus(id, siguiente)
      pedidos[id] = { ...pedido, ...updated }
      historial[id] = anterior
      if (siguiente === 'ready') {
        notificarPedidoListo(id, rest.id).catch(() => {})
        // Trigger followup msg1 — solo para restaurantes
        if (rest.business_type === 'restaurant' || !rest.business_type) {
          scheduleFollowup(pedidos[id], 'first_plate').catch(() => {})
        }
      }
      if (siguiente === 'delivered') {
        // Trigger followup msg2 + msg3 — solo para restaurantes
        if (rest.business_type === 'restaurant' || !rest.business_type) {
          scheduleFollowup(pedidos[id], 'all_plates').catch(() => {})
        }
      }
    } catch {
      if (btn) btn.disabled = false
      return
    }
    renderAll()
  }

  async function deshacerEnCard(id) {
    const anterior = historial[id]
    if (!anterior) return
    delete historial[id]
    try {
      const updated = await orders.updateStatus(id, anterior)
      pedidos[id] = { ...pedidos[id], ...updated }
    } catch {
      historial[id] = anterior
      return
    }
    renderAll()
  }

  // ── Notificación WhatsApp al cliente ──────────────────────────────────────────
  async function notificarPedidoListo(orderId, restaurantId) {
    try {
      await fetch('https://vitrina-tano.vitrinaapp.workers.dev/api/notificar-pedido-listo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, restaurantId }),
      })
    } catch (e) {
      console.error('Error al notificar pedido listo:', e)
    }
  }

  // ── WA Followup — mensajes automáticos de seguimiento ─────────────────────────
  // Solo se ejecuta si rest.business_type === 'restaurant' (o sin tipo definido).
  // Skip silencioso si el pedido no tiene customer_phone.
  async function scheduleFollowup(pedido, trigger) {
    const phone = pedido?.customer_phone
    if (!phone) return // sin teléfono → skip silencioso
    if (!rest?.wa_followup_config?.enabled) return // feature desactivada
    try {
      await fetch('https://vitrina-tano.vitrinaapp.workers.dev/api/wa/schedule-followup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          orderId:      pedido.id,
          restaurantId: rest.id,
          trigger,
          phone,
        }),
      })
    } catch {
      // Fallo silencioso — no interrumpir el flujo de cocina
    }
  }

  // ── Filter ────────────────────────────────────────────────────────────────────
  window.setFilter = function (f) {
    currentFilter = f
    document.querySelectorAll('.filter-tab').forEach(btn => {
      const isActive = btn.dataset.filter === f
      btn.classList.toggle('active', isActive)
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false')
    })
    renderAll()
  }

  function matchesFilter(pedido) {
    if (currentFilter === 'all') return true
    if (currentFilter === 'active') return pedido.status === 'pending' || pedido.status === 'confirmed' || pedido.status === 'preparing'
    return pedido.status === currentFilter
  }

  function updateFilterCounts() {
    const all = Object.values(pedidos)
    const counts = {
      active:    all.filter(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing').length,
      pending:   all.filter(p => p.status === 'pending' || p.status === 'confirmed').length,
      preparing: all.filter(p => p.status === 'preparing').length,
      ready:     all.filter(p => p.status === 'ready').length,
    }
    Object.entries(counts).forEach(([key, n]) => {
      const el = document.getElementById('fc-' + key)
      if (!el) return
      el.textContent = n
      el.style.display = n > 0 ? 'inline-block' : 'none'
    })
  }

  // ── Elapsed time ─────────────────────────────────────────────────────────────
  function formatElapsed(iso) {
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000)
    if (mins < 1) return 'hace un momento'
    if (mins === 1) return 'hace 1 min'
    return 'hace ' + mins + ' min'
  }

  function elapsedClass(iso, status) {
    if (status === 'ready' || status === 'delivered') return 'ok'
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000)
    if (mins >= 20) return 'danger'
    if (mins >= 10) return 'warn'
    return 'ok'
  }

  function startElapsedTimer() {
    if (elapsedTimer) clearInterval(elapsedTimer)
    elapsedTimer = setInterval(() => {
      document.querySelectorAll('.elapsed[data-ts]').forEach(el => {
        const iso = el.dataset.ts
        const status = el.dataset.status || 'pending'
        el.textContent = formatElapsed(iso)
        el.className = 'elapsed ' + elapsedClass(iso, status)
      })
    }, 30000) // actualizar cada 30s
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  const BADGE_LABEL = {
    pending: '⏳ Pendiente', confirmed: '⏳ Pendiente',
    preparing: '🔥 Preparando', ready: '✅ Listo',
    paid: '💳 Pagado',
  }
  const BADGE_CLASS = {
    pending: 'badge-pending', confirmed: 'badge-confirmed',
    preparing: 'badge-preparing', ready: 'badge-ready',
    paid: 'badge-ready',
  }

  function formatHora(iso) {
    try { return new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) }
    catch { return iso }
  }

  function renderAll() {
    updateFilterCounts()
    const boards = document.getElementById('boards')
    const listaAll = Object.values(pedidos).sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

    if (listaAll.length === 0) {
      boards.innerHTML = '<div class="empty-state"><div class="empty-icon">🍽️</div>Esperando pedidos…<br>Los pedidos aparecen acá en tiempo real.</div>'
      return
    }

    // Filtrar según tab activo
    const lista = listaAll.filter(matchesFilter)

    if (lista.length === 0) {
      const labels = { active: 'activos', pending: 'pendientes', preparing: 'en preparación', ready: 'listos', all: '' }
      boards.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div>Sin pedidos ' + (labels[currentFilter] || '') + ' en este momento.</div>'
      return
    }

    // Agrupar por mesa
    const mesaMap = {}
    const mesaOrder = []
    for (const p of lista) {
      const key = p.table_number != null ? String(p.table_number) : 'sin-mesa'
      if (!mesaMap[key]) { mesaMap[key] = []; mesaOrder.push(key) }
      mesaMap[key].push(p)
    }

    // Mesas con pedidos activos primero
    mesaOrder.sort((a, b) => {
      const prioA = mesaMap[a].some(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing') ? 0 : 1
      const prioB = mesaMap[b].some(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing') ? 0 : 1
      return prioA - prioB
    })

    boards.innerHTML = mesaOrder.map(key => {
      const pedidosMesa = mesaMap[key]
      const mesaLabel = key === 'sin-mesa' ? 'Sin mesa' : 'Mesa ' + key
      const hayNuevo = pedidosMesa.some(p =>
        (p.status === 'pending' || p.status === 'confirmed') &&
        (Date.now() - new Date(p.created_at).getTime()) < 30000
      )
      const totalItems = pedidosMesa.reduce((s, p) => s + (p.order_items || []).reduce((si, i) => si + i.quantity, 0), 0)
      const nPedidos = pedidosMesa.length
      const hayPreparando = pedidosMesa.some(p => p.status === 'preparing')

      const cardsHtml = pedidosMesa.map((p, idx) => {
        const esNuevo = (p.status === 'pending' || p.status === 'confirmed')
          && (Date.now() - new Date(p.created_at).getTime()) < 30000
        const cardId = 'card-' + p.id.replace(/-/g, '_')
        const isDone = p.status === 'ready' || p.status === 'delivered'
        const canAct = !isDone
        const canUndo = !!historial[p.id]
        const items = p.order_items || []

        return '<div class="pedido-card' + (p.status === 'ready' ? ' status-ready' : '') + '" id="' + cardId + '">'
          + '<div class="pedido-header">'
          +   '<div>'
          +     (nPedidos > 1
                  ? '<div class="pedido-num">Pedido ' + (idx + 1) + ' de ' + nPedidos
                    + (esNuevo ? ' <span class="nuevo-badge">NUEVO</span>' : '') + '</div>'
                  : (esNuevo ? '<div class="pedido-num"><span class="nuevo-badge">NUEVO</span></div>' : ''))
          +     '<div class="pedido-id">#' + p.id.slice(-6).toUpperCase() + '</div>'
          +     (p.customer_name ? '<div style="font-size:12px;color:#c8a84a;margin-top:2px">👤 ' + esc(p.customer_name) + '</div>' : '')
          +   '</div>'
          +   '<div style="text-align:right">'
          +     '<span class="estado-badge ' + (BADGE_CLASS[p.status] || '') + '">' + (BADGE_LABEL[p.status] || p.status) + '</span>'
          +     (p.paid_at ? '<span class="estado-badge badge-ready" style="margin-left:4px">💳 Pagado</span>' : '')
          +     '<div class="elapsed ' + elapsedClass(p.created_at, p.status) + '" data-ts="' + p.created_at + '" data-status="' + p.status + '">' + formatElapsed(p.created_at) + '</div>'
          +   '</div>'
          + '</div>'
          + '<div class="pedido-items">'
          + items.map(item =>
              '<div class="pedido-item">'
              + '<span class="item-qty">x' + item.quantity + '</span>'
              + '<span class="item-name-cocina">' + esc(item.name) + '</span>'
              + '</div>'
            ).join('')
          + '</div>'
          + '<div class="pedido-footer">'
            + (canAct ? '<button class="estado-btn ' + p.status + '" data-id="' + p.id + '" onclick="cambiarEstado(this.dataset.id)">' + labelBtn(p.status) + '</button>' : '')
            + (canUndo ? '<button class="card-undo-btn" data-id="' + p.id + '" onclick="deshacerEnCard(this.dataset.id)" title="Deshacer">&#8617;</button>' : '')
            + '<button class="card-undo-btn" data-id="' + p.id + '" onclick="imprimirComandaCocina(this.dataset.id)" title="Imprimir comanda">&#128424;</button>'
          + '</div>'
          + (isDone ? '' : (() => {
              const totalSec = Math.floor((Date.now() - new Date(p.created_at).getTime()) / 1000)
              const minElapsed = Math.floor(totalSec / 60)
              const mm = String(Math.floor(totalSec / 60)).padStart(2, '0')
              const ss = String(totalSec % 60).padStart(2, '0')
              const tc = minElapsed >= 15 ? 'red-pulse' : minElapsed >= 10 ? 'red' : minElapsed >= 5 ? 'yellow' : 'green'
              const te = minElapsed >= 15 ? '🔴' : minElapsed >= 10 ? '🟠' : minElapsed >= 5 ? '🟡' : '🟢'
              return '<div class="pedido-timer ' + tc + '" data-created="' + p.created_at + '">' + te + ' <span class="timer-display">' + mm + ':' + ss + '</span></div>'
            })())
          + '</div>'
      }).join('')

      // Total de la mesa — suma de todos los pedidos activos
      const totalMesa = pedidosMesa
        .filter(p => p.status !== 'cancelled' && p.status !== 'paid')
        .reduce((s, p) => s + Number(p.total || 0), 0)
      const isRestaurant = !rest.business_type || rest.business_type === 'restaurant'
      const orderIdsMesa = pedidosMesa
        .filter(p => p.status !== 'cancelled' && p.status !== 'paid')
        .map(p => p.id)

      return '<div class="mesa-group">'
        + '<div class="mesa-group-header">'
        +   '<div class="mesa-group-title">' + mesaLabel + (hayNuevo ? ' <span class="nuevo-badge">NUEVO</span>' : '') + '</div>'
        +   '<div class="mesa-group-meta">'
        +     (nPedidos > 1 ? '<span class="mesa-order-count">' + nPedidos + ' pedidos</span>' : '')
        +     '<span>' + totalItems + ' ítem' + (totalItems !== 1 ? 's' : '') + '</span>'
        +     (isRestaurant && totalMesa > 0
                ? '<span style="font-size:11px;font-weight:600;color:#c8a84a;margin-left:4px">$' + totalMesa.toLocaleString('es-AR') + '</span>'
                : '')
        +     (hayPreparando ? '<button class="mesa-listo-btn" data-key="' + key + '" onclick="marcarMesaListos(this.dataset.key)">✓ Todo listo</button>' : '')
        +     (isRestaurant && orderIdsMesa.length > 0
                ? '<button class="mesa-listo-btn" style="background:#22aa4420;border-color:#22aa4440;color:#44cc66;margin-left:4px" '
                  + 'data-key="' + key + '" data-table="' + key + '" data-total="' + totalMesa + '" data-n="' + nPedidos + '" data-ids="' + orderIdsMesa.join(',') + '" '
                  + 'onclick="cobrarMesa(this)">💳 Cobrar</button>'
                : '')
        +   '</div>'
        + '</div>'
        + cardsHtml
        + '</div>'
    }).join('')

    startElapsedTimer()
    startTimers()
  }

  function startTimers() {
    if (window._timerInterval) clearInterval(window._timerInterval)
    window._timerInterval = setInterval(() => {
      document.querySelectorAll('.pedido-timer[data-created]').forEach(el => {
        const created = new Date(el.getAttribute('data-created'))
        const totalSec = Math.floor((Date.now() - created.getTime()) / 1000)
        const mm = String(Math.floor(totalSec / 60)).padStart(2, '0')
        const ss = String(totalSec % 60).padStart(2, '0')
        const minElapsed = Math.floor(totalSec / 60)
        const display = el.querySelector('.timer-display')
        if (display) display.textContent = mm + ':' + ss
        const tc = minElapsed >= 15 ? 'red-pulse' : minElapsed >= 10 ? 'red' : minElapsed >= 5 ? 'yellow' : 'green'
        el.className = 'pedido-timer ' + tc
      })
    }, 1000)
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  async function marcarMesaListos(key) {
    const pedidosMesa = Object.values(pedidos).filter(p => {
      const k = p.table_number != null ? String(p.table_number) : 'sin-mesa'
      return k === key && p.status === 'preparing'
    })
    for (const p of pedidosMesa) {
      try {
        const updated = await orders.updateStatus(p.id, 'ready')
        pedidos[p.id] = { ...pedidos[p.id], ...updated }
        historial[p.id] = 'preparing'

        // Notificar al cliente por WhatsApp
        notificarPedidoListo(p.id, rest.id).catch(() => {})
      } catch {}
    }
    renderAll()
  }

  // ── Cobrar mesa (SOLO restaurant) ────────────────────────────────────────────
  let _cobroData = null // { tableNumber, orderIds, total, nPedidos }

  window.cobrarMesa = function (btn) {
    // Solo para restaurantes
    if (rest.business_type && rest.business_type !== 'restaurant') return

    const tableNumber = btn.dataset.table
    const total       = Number(btn.dataset.total)
    const nPedidos    = Number(btn.dataset.n)
    const orderIds    = btn.dataset.ids.split(',').filter(Boolean)

    _cobroData = { tableNumber, orderIds, total, nPedidos }

    const mesaLabel = tableNumber && tableNumber !== 'sin-mesa' ? 'Mesa ' + tableNumber : 'Sin mesa'
    document.getElementById('cobro-title').textContent = mesaLabel + ' · Cobrar'
    document.getElementById('cobro-desglose').textContent =
      nPedidos + ' pedido' + (nPedidos !== 1 ? 's' : '') + ' · ' + orderIds.length + ' orden' + (orderIds.length !== 1 ? 'es' : '') + ' activas'
    document.getElementById('cobro-total').textContent = '$' + total.toLocaleString('es-AR')
    document.getElementById('cobro-btn-generar').disabled = false
    document.getElementById('cobro-btn-generar').textContent = '💳 Generar link de pago'
    document.getElementById('cobro-modal').style.display = 'flex'
  }

  window.generarPagoMesa = async function () {
    if (!_cobroData) return
    const btn = document.getElementById('cobro-btn-generar')
    btn.disabled = true
    btn.textContent = 'Generando...'
    try {
      const res = await fetch('https://vitrina-tano.vitrinaapp.workers.dev/api/mp/crear-preferencia', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          restaurantId: rest.id,
          tableNumber:  _cobroData.tableNumber !== 'sin-mesa' ? Number(_cobroData.tableNumber) : null,
          orderIds:     _cobroData.orderIds,
          currency:     'ARS',
        }),
      })
      const data = await res.json()
      if (!res.ok || !data.init_point) {
        alert('No se pudo generar el link de pago: ' + (data.error || 'intente nuevamente'))
        btn.disabled = false
        btn.textContent = '💳 Generar link de pago'
        return
      }
      // Abrir en nueva pestaña y cerrar modal
      window.open(data.init_point, '_blank')
      document.getElementById('cobro-modal').style.display = 'none'
      _cobroData = null
    } catch (e) {
      alert('Error de red: ' + e.message)
      btn.disabled = false
      btn.textContent = '💳 Generar link de pago'
    }
  }

  // Imprime la comanda en formato ticket 80mm (impresora térmica o común).
  window.imprimirComandaCocina = function (id) {
    const p = pedidos[id]
    if (!p) return
    const items = p.order_items || []
    const fecha = new Date(p.created_at)
    const hora = fecha.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })
    const dia  = fecha.toLocaleDateString('es-AR')
    const w = window.open('', '_blank', 'width=400,height=620')
    if (!w) return
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Comanda</title>'
      + '<style>@page{size:80mm auto;margin:4mm}body{font-family:\'Courier New\',monospace;width:72mm;margin:0 auto;color:#000;font-size:13px}.c{text-align:center}.rest{font-size:15px;font-weight:bold}.mesa{font-size:26px;font-weight:bold;margin:6px 0}hr{border:none;border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td{padding:3px 0;vertical-align:top;font-size:14px}.qty{width:34px;font-weight:bold;font-size:16px}.price{text-align:right;white-space:nowrap}.total{font-size:16px;font-weight:bold}.meta{font-size:11px}.nota{font-style:italic;font-size:12px}</style>'
      + '</head><body>'
      + '<div class="c rest">' + esc(rest?.name || '') + '</div>'
      + '<div class="c meta">' + dia + ' · ' + hora + ' · #' + String(p.id).slice(-6).toUpperCase() + '</div>'
      + '<div class="c mesa">MESA ' + esc(String(p.table_number ?? '—')) + '</div>'
      + (p.customer_name ? '<div class="c meta">Cliente: ' + esc(p.customer_name) + '</div>' : '')
      + '<hr><table>'
      + items.map(i => '<tr><td class="qty">' + i.quantity + '×</td><td>' + esc(i.name) + '</td><td class="price">$' + Number(i.price * i.quantity).toLocaleString('es-AR') + '</td></tr>').join('')
      + '</table>'
      + (p.notes ? '<hr><div class="nota">Nota: ' + esc(p.notes) + '</div>' : '')
      + '<hr><table><tr><td class="total">TOTAL</td><td class="price total">$' + Number(p.total || 0).toLocaleString('es-AR') + '</td></tr></table>'
      + '<hr><div class="c meta">vitrinaapp.com.ar</div>'
      + '<scr' + 'ipt>window.onload=function(){window.print();window.onafterprint=function(){window.close()}}</scr' + 'ipt>'
      + '</body></html>')
    w.document.close()
  }

  window.cambiarEstado = cambiarEstado
  window.deshacerEnCard = deshacerEnCard
  window.marcarMesaListos = marcarMesaListos

  init()
</script>
</body>
