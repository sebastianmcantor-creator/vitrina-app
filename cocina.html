<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cocina — Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; font-family: 'DM Sans', sans-serif; color: #f0f0f0; min-height: 100vh; }

    #loading-screen, #login-screen, #error-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 20px; text-align: center; color: #666;
    }

    .login-title { font-size: 22px; font-weight: 600; color: #f0f0f0; }
    .login-sub { font-size: 14px; color: #666; }
    .google-btn {
      display: flex; align-items: center; gap: 10px;
      background: #fff; color: #1a1208; border: none; border-radius: 10px;
      padding: 12px 22px; font-family: 'DM Sans', sans-serif; font-size: 15px;
      font-weight: 500; cursor: pointer; margin-top: 8px;
    }
    .google-btn:hover { background: #f5f5f5; }

    #main-view { display: none; }

    .header {
      background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      padding: 16px 24px; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-sub { font-size: 12px; color: #666; margin-top: 2px; }
    .conn-label { font-size: 12px; color: #888; display: flex; align-items: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; display: inline-block; margin-right: 6px; }
    .status-dot.connected { background: #44cc66; }

    .boards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px; padding: 24px;
    }

    .pedido-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; overflow: hidden; animation: slideIn 0.3s ease; transition: border-color 0.2s; }
    .pedido-card:hover:not(.status-ready) { border-color: #3a3a3a; }
    .pedido-card.status-ready { border-color: #1a4a2a; opacity: 0.6; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pedido-header {
      background: #222; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }
    .mesa-label { font-size: 16px; font-weight: 600; }
    .pedido-hora { font-size: 12px; color: #888; }
    .pedido-id { font-size: 11px; color: #555; }

    .pedido-items { padding: 14px 16px; }
    .pedido-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #1e1e1e; font-size: 15px;
    }
    .pedido-item:last-child { border-bottom: none; }
    .item-qty { color: #c8a84a; font-weight: 700; margin-right: 10px; font-size: 18px; min-width: 28px; }
    .item-name-cocina { flex: 1; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }

    .pedido-footer { padding: 12px 16px; border-top: 1px solid #2a2a2a; display: flex; gap: 8px; }
    .estado-btn { flex: 1; border: none; border-radius: 10px; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
    .estado-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .estado-btn:active:not(:disabled) { transform: translateY(0); }
    .estado-btn.pending, .estado-btn.confirmed { background: #c8a84a; color: #0f0f0f; box-shadow: 0 2px 8px rgba(200,168,74,0.3); }
    .estado-btn.preparing { background: #2255cc; color: white; box-shadow: 0 2px 8px rgba(34,85,204,0.3); }
    .estado-btn.ready { background: #22aa44; color: white; box-shadow: 0 2px 8px rgba(34,170,68,0.3); }
    .estado-btn:disabled { opacity: 0.4; cursor: default; }

    .estado-badge { font-size: 12px; padding: 4px 10px; border-radius: 8px; font-weight: 600; letter-spacing: 0.02em; }
    .badge-pending, .badge-confirmed { background: #3a2e00; color: #c8a84a; }
    .badge-preparing { background: #001a44; color: #6699ff; }
    .badge-ready { background: #002211; color: #44cc66; }

    .card-undo-btn {
      flex-shrink: 0; background: #2a2a2a; border: 1px solid #3a3a3a;
      border-radius: 10px; padding: 10px 13px; font-size: 16px; line-height: 1;
      cursor: pointer; color: #888; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .card-undo-btn:hover { background: #333; border-color: #c8a84a; color: #c8a84a; }

    .nuevo-badge {
      background: #c8553d; color: white; font-size: 10px;
      padding: 2px 6px; border-radius: 6px; margin-left: 6px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .empty-state {
      text-align: center; color: #444; padding: 80px 20px;
      font-size: 15px; grid-column: 1 / -1;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 8px; padding: 12px 24px 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 20px; padding: 6px 16px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; color: #888; cursor: pointer; transition: all .15s;
    }
    .filter-tab.active { background: #c8a84a20; border-color: #c8a84a; color: #c8a84a; font-weight: 600; }
    .filter-tab:hover:not(.active) { border-color: #444; color: #ccc; }
    .filter-count {
      display: inline-block; background: #c8553d; color: #fff;
      border-radius: 10px; font-size: 10px; padding: 1px 6px; margin-left: 4px;
    }

    /* Elapsed time */
    .elapsed { font-size: 11px; margin-top:2px; }
    .elapsed.ok { color: #888; }
    .elapsed.warn { color: #e8a844; }
    .elapsed.danger { color: #e84444; font-weight: 600; }

    /* Mesa action */
    .mesa-listo-btn {
      background: #22aa4420; border: 1px solid #22aa4440; color: #44cc66;
      border-radius: 8px; padding: 3px 10px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background .15s;
    }
    .mesa-listo-btn:hover { background: #22aa4440; }

    /* Agrupación por mesa */
    .mesa-group {
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; gap: 0;
    }
    .mesa-group-header { background: linear-gradient(135deg, #1e1e1e 0%, #242424 100%); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
    .mesa-group-title { font-size: 22px; font-weight: 700; color: #f0f0f0; letter-spacing: -0.01em; }
    .mesa-group-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #888; }
    .mesa-order-count {
      background: #c8a84a20; color: #c8a84a;
      padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
    }
    .mesa-group .pedido-card {
      border-radius: 0; border: none; border-top: 1px solid #222;
      animation: none;
    }
    .mesa-group .pedido-card:first-of-type { border-top: none; }
    .mesa-group .pedido-header { background: #1a1a1a; }
    .pedido-num { font-size: 12px; color: #888; font-weight: 400; }
    @media (max-width: 480px) {
      .header { padding: 12px 16px; }
      .header-title { font-size: 16px; }
      .boards { padding: 12px; gap: 12px; }
      .filter-bar { padding: 8px 12px 0; gap: 6px; }
      .filter-tab { padding: 5px 12px; font-size: 12px; }
    }
    @media print {
      body { background: white; color: black; }
      .filter-bar, .header .conn-label, #btn-mute-sound { display: none !important; }
      .boards { grid-template-columns: repeat(2, 1fr); padding: 8px; gap: 8px; }
      .mesa-group { border: 1px solid #ccc; break-inside: avoid; }
      .mesa-group-header { background: #f5f5f5 !important; color: black !important; }
      .pedido-card { background: white !important; border: 1px solid #ddd !important; }
      .estado-btn, .card-undo-btn { display: none !important; }
      .item-qty { color: #333 !important; }
      .item-name-cocina { color: black !important; }
      .estado-badge { border: 1px solid #ccc; background: white !important; color: black !important; }
      .nuevo-badge { background: #333 !important; }
    }
  </style>
</head>
<body>

<div id="loading-screen">Cargando…</div>

<div id="login-screen" style="display:none">
  <div style="font-size:48px">🍳</div>
  <div class="login-title">Panel de Cocina</div>
  <div class="login-sub">Iniciá sesión para ver los pedidos</div>
  <button class="google-btn" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
    Iniciar sesión con Google
  </button>
</div>

<div id="error-screen" style="display:none">
  <div style="font-size:48px">😕</div>
  <div id="error-msg" style="color:#f0f0f0;font-size:16px"></div>
</div>

<div id="main-view">
  <div class="header">
    <div>
      <div class="header-title">🍳 Panel de Cocina</div>
      <div class="header-sub" id="rest-sub">Cargando…</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="btn-mute-sound" onclick="toggleMuteSound()" title="Silenciar alertas"
        style="background:none;border:1px solid #3a3a3a;color:#888;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif"
        onmouseover="this.style.borderColor='#c8a84a';this.style.color='#c8a84a'"
        onmouseout="if(!soundMuted){this.style.borderColor='#3a3a3a';this.style.color='#888'}">
        🔊 Sonido
      </button>
      <div class="conn-label">
        <span class="status-dot" id="status-dot"></span>
        <span id="conn-label">Conectando...</span>
      </div>
    </div>
  </div>
  <div class="filter-bar" id="filter-bar">
    <button class="filter-tab active" data-filter="active" onclick="setFilter('active')">
      🔥 Activos <span class="filter-count" id="fc-active" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">
      ⏳ Pendientes <span class="filter-count" id="fc-pending" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="preparing" onclick="setFilter('preparing')">
      🔥 Preparando <span class="filter-count" id="fc-preparing" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="ready" onclick="setFilter('ready')">
      ✅ Listos <span class="filter-count" id="fc-ready" style="display:none">0</span>
    </button>
    <button class="filter-tab" data-filter="all" onclick="setFilter('all')">
      📋 Todos
    </button>
  </div>
  <div class="boards" id="boards">
    <div class="empty-state">
      <div class="empty-icon">🍽️</div>
      Esperando pedidos…<br>Los pedidos aparecen acá en tiempo real.
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './lib/supabase.js'
  import { restaurants, orders } from './lib/db.js'

  const params = new URLSearchParams(location.search)
  const slug = params.get('slug')

  let rest = null
  let pedidos = {}
  let historial = {}
  let realtimeChannel = null
  let currentFilter = 'active' // all | active | pending | preparing | ready
  let elapsedTimer = null
  let soundMuted = localStorage.getItem('cocina_muted') === '1'
  function toggleMuteSound() {
    soundMuted = !soundMuted
    localStorage.setItem('cocina_muted', soundMuted ? '1' : '0')
    const btn = document.getElementById('btn-mute-sound')
    if (btn) {
      btn.textContent = soundMuted ? '🔇 Silenciado' : '🔊 Sonido'
      btn.style.borderColor = soundMuted ? '#c8553d' : '#3a3a3a'
      btn.style.color = soundMuted ? '#c8553d' : '#888'
    }
  }
  window.toggleMuteSound = toggleMuteSound

  // ── Auth ──────────────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) {
      show('login-screen')
      return
    }
    await startKitchen()
  }

  async function startKitchen() {
    if (!slug) { showError('URL inválida — falta el parámetro slug.\nEjemplo: cocina.html?slug=mi-restaurante'); return }
    try {
      rest = await restaurants.getBySlug(slug)
    } catch {
      showError('No se encontró el restaurante "' + slug + '".')
      return
    }
    document.getElementById('rest-sub').textContent = rest.name + ' — Pedidos en tiempo real'
    show('main-view')
    await fetchPedidos()
    suscribirRealtime()

    // Restaurar estado del botón de sonido
    ;(function initSoundBtn() {
      const btn = document.getElementById('btn-mute-sound')
      if (btn && soundMuted) {
        btn.textContent = '🔇 Silenciado'
        btn.style.borderColor = '#c8553d'
        btn.style.color = '#c8553d'
      }
    })()
  }

  window.loginGoogle = async function () {
    await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.href },
    })
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (session && !rest) {
      startKitchen()
      return
    }
    if (!session) {
      if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null }
      if (rest) {
        // Sesión expirada durante uso activo — resetear y mostrar login sin recargar
        rest = null; pedidos = {}; historial = {}
        show('login-screen')
      }
    }
  })

  window.addEventListener('beforeunload', () => {
    if (realtimeChannel) supabase.removeChannel(realtimeChannel)
  })

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function show(id) {
    ['loading-screen','login-screen','error-screen','main-view'].forEach(s => {
      document.getElementById(s).style.display = s === id ? (id === 'main-view' ? 'block' : 'flex') : 'none'
    })
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg
    show('error-screen')
  }

  function setStatus(online) {
    document.getElementById('status-dot').classList.toggle('connected', online)
    document.getElementById('conn-label').textContent = online ? 'En línea' : 'Sin conexión'
  }

  // ── Carga inicial ─────────────────────────────────────────────────────────────
  async function fetchPedidos() {
    try {
      const lista = await orders.listActive(rest.id)
      const nuevos = lista.filter(p => !pedidos[p.id] && (p.status === 'pending' || p.status === 'confirmed'))
      if (nuevos.length > 0) playSound()
      pedidos = {}
      lista.forEach(p => { pedidos[p.id] = p })
      setStatus(true)
      renderAll()
    } catch {
      setStatus(false)
    }
  }

  // ── Realtime ──────────────────────────────────────────────────────────────────
  function suscribirRealtime() {
    if (realtimeChannel) supabase.removeChannel(realtimeChannel)

    realtimeChannel = supabase
      .channel('cocina-' + rest.id)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'orders',
        filter: 'restaurant_id=eq.' + rest.id,
      }, async payload => {
        const order = payload.new
        if (!order) return

        if (payload.eventType === 'DELETE' || order.status === 'delivered' || order.status === 'cancelled') {
          delete pedidos[order.id]
          renderAll()
          return
        }

        // Para INSERT necesitamos los order_items — hacemos fetch puntual
        if (payload.eventType === 'INSERT') {
          try {
            const { data } = await supabase
              .from('orders')
              .select('*, order_items(*)')
              .eq('id', order.id)
              .single()
            if (data) {
              const esNuevo = !pedidos[data.id]
              pedidos[data.id] = data
              if (esNuevo) playSound()
            }
          } catch {}
        } else {
          // UPDATE: actualizar solo los campos del order, conservar order_items
          if (pedidos[order.id]) {
            pedidos[order.id] = { ...pedidos[order.id], ...order }
          }
        }
        renderAll()
        setStatus(true)
      })
      .subscribe(status => {
        setStatus(status === 'SUBSCRIBED')
      })
  }

  // ── Sound ─────────────────────────────────────────────────────────────────────
  function playSound() {
    if (soundMuted) return
    try {
      const ctx = new AudioContext()
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.connect(gain)
      gain.connect(ctx.destination)
      osc.frequency.value = 880
      gain.gain.setValueAtTime(0.3, ctx.currentTime)
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4)
      osc.start(ctx.currentTime)
      osc.stop(ctx.currentTime + 0.4)
    } catch {}
  }

  // ── State transitions ─────────────────────────────────────────────────────────
  function siguienteEstado(status) {
    if (status === 'pending' || status === 'confirmed') return 'preparing'
    if (status === 'preparing') return 'ready'
    return 'delivered'
  }

  function labelBtn(status) {
    if (status === 'pending' || status === 'confirmed') return '▶ Empezar a preparar'
    if (status === 'preparing') return '✓ Marcar como listo'
    return '✓ Marcar entregado'
  }

  async function cambiarEstado(id) {
    const pedido = pedidos[id]
    if (!pedido || pedido.status === 'delivered') return
    const anterior = pedido.status
    const siguiente = siguienteEstado(anterior)

    const btn = document.querySelector('#card-' + id.replace(/-/g,'_') + ' .estado-btn')
    if (btn) { btn.disabled = true }

    try {
      const updated = await orders.updateStatus(id, siguiente)
      pedidos[id] = { ...pedido, ...updated }
      historial[id] = anterior

      // Si el pedido está listo, notificar al cliente por WhatsApp
      if (siguiente === 'ready') {
        notificarPedidoListo(id, restaurantId).catch(() => {})
      }
    } catch {
      if (btn) { btn.disabled = false }
      return
    }
    renderAll()
  }

  async function deshacerEnCard(id) {
    const anterior = historial[id]
    if (!anterior) return
    delete historial[id]
    try {
      const updated = await orders.updateStatus(id, anterior)
      pedidos[id] = { ...pedidos[id], ...updated }
    } catch {
      historial[id] = anterior
      return
    }
    renderAll()
  }

  // ── Notificación WhatsApp al cliente ──────────────────────────────────────────
  async function notificarPedidoListo(orderId, restaurantId) {
    try {
      await fetch('https://vitrina-tano.vitrinaapp.workers.dev/api/notificar-pedido-listo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, restaurantId }),
      })
    } catch (e) {
      console.error('Error al notificar pedido listo:', e)
    }
  }

  // ── Filter ────────────────────────────────────────────────────────────────────
  window.setFilter = function (f) {
    currentFilter = f
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === f)
    })
    renderAll()
  }

  function matchesFilter(pedido) {
    if (currentFilter === 'all') return true
    if (currentFilter === 'active') return pedido.status === 'pending' || pedido.status === 'confirmed' || pedido.status === 'preparing'
    return pedido.status === currentFilter
  }

  function updateFilterCounts() {
    const all = Object.values(pedidos)
    const counts = {
      active:    all.filter(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing').length,
      pending:   all.filter(p => p.status === 'pending' || p.status === 'confirmed').length,
      preparing: all.filter(p => p.status === 'preparing').length,
      ready:     all.filter(p => p.status === 'ready').length,
    }
    Object.entries(counts).forEach(([key, n]) => {
      const el = document.getElementById('fc-' + key)
      if (!el) return
      el.textContent = n
      el.style.display = n > 0 ? 'inline-block' : 'none'
    })
  }

  // ── Elapsed time ─────────────────────────────────────────────────────────────
  function formatElapsed(iso) {
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000)
    if (mins < 1) return 'hace un momento'
    if (mins === 1) return 'hace 1 min'
    return 'hace ' + mins + ' min'
  }

  function elapsedClass(iso, status) {
    if (status === 'ready' || status === 'delivered') return 'ok'
    const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000)
    if (mins >= 20) return 'danger'
    if (mins >= 10) return 'warn'
    return 'ok'
  }

  function startElapsedTimer() {
    if (elapsedTimer) clearInterval(elapsedTimer)
    elapsedTimer = setInterval(() => {
      document.querySelectorAll('.elapsed[data-ts]').forEach(el => {
        const iso = el.dataset.ts
        const status = el.dataset.status || 'pending'
        el.textContent = formatElapsed(iso)
        el.className = 'elapsed ' + elapsedClass(iso, status)
      })
    }, 30000) // actualizar cada 30s
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  const BADGE_LABEL = {
    pending: '⏳ Pendiente', confirmed: '⏳ Pendiente',
    preparing: '🔥 Preparando', ready: '✅ Listo',
  }
  const BADGE_CLASS = {
    pending: 'badge-pending', confirmed: 'badge-confirmed',
    preparing: 'badge-preparing', ready: 'badge-ready',
  }

  function formatHora(iso) {
    try { return new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) }
    catch { return iso }
  }

  function renderAll() {
    updateFilterCounts()
    const boards = document.getElementById('boards')
    const listaAll = Object.values(pedidos).sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

    if (listaAll.length === 0) {
      boards.innerHTML = '<div class="empty-state"><div class="empty-icon">🍽️</div>Esperando pedidos…<br>Los pedidos aparecen acá en tiempo real.</div>'
      return
    }

    // Filtrar según tab activo
    const lista = listaAll.filter(matchesFilter)

    if (lista.length === 0) {
      const labels = { active: 'activos', pending: 'pendientes', preparing: 'en preparación', ready: 'listos', all: '' }
      boards.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div>Sin pedidos ' + (labels[currentFilter] || '') + ' en este momento.</div>'
      return
    }

    // Agrupar por mesa
    const mesaMap = {}
    const mesaOrder = []
    for (const p of lista) {
      const key = p.table_number != null ? String(p.table_number) : 'sin-mesa'
      if (!mesaMap[key]) { mesaMap[key] = []; mesaOrder.push(key) }
      mesaMap[key].push(p)
    }

    // Mesas con pedidos activos primero
    mesaOrder.sort((a, b) => {
      const prioA = mesaMap[a].some(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing') ? 0 : 1
      const prioB = mesaMap[b].some(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'preparing') ? 0 : 1
      return prioA - prioB
    })

    boards.innerHTML = mesaOrder.map(key => {
      const pedidosMesa = mesaMap[key]
      const mesaLabel = key === 'sin-mesa' ? 'Sin mesa' : 'Mesa ' + key
      const hayNuevo = pedidosMesa.some(p =>
        (p.status === 'pending' || p.status === 'confirmed') &&
        (Date.now() - new Date(p.created_at).getTime()) < 30000
      )
      const totalItems = pedidosMesa.reduce((s, p) => s + (p.order_items || []).reduce((si, i) => si + i.quantity, 0), 0)
      const nPedidos = pedidosMesa.length
      const hayPreparando = pedidosMesa.some(p => p.status === 'preparing')

      const cardsHtml = pedidosMesa.map((p, idx) => {
        const esNuevo = (p.status === 'pending' || p.status === 'confirmed')
          && (Date.now() - new Date(p.created_at).getTime()) < 30000
        const cardId = 'card-' + p.id.replace(/-/g, '_')
        const isDone = p.status === 'ready' || p.status === 'delivered'
        const canAct = !isDone
        const canUndo = !!historial[p.id]
        const items = p.order_items || []

        return '<div class="pedido-card' + (p.status === 'ready' ? ' status-ready' : '') + '" id="' + cardId + '">'
          + '<div class="pedido-header">'
          +   '<div>'
          +     (nPedidos > 1
                  ? '<div class="pedido-num">Pedido ' + (idx + 1) + ' de ' + nPedidos
                    + (esNuevo ? ' <span class="nuevo-badge">NUEVO</span>' : '') + '</div>'
                  : (esNuevo ? '<div class="pedido-num"><span class="nuevo-badge">NUEVO</span></div>' : ''))
          +     '<div class="pedido-id">#' + p.id.slice(-6).toUpperCase() + '</div>'
          +     (p.customer_name ? '<div style="font-size:12px;color:#c8a84a;margin-top:2px">👤 ' + p.customer_name + '</div>' : '')
          +   '</div>'
          +   '<div style="text-align:right">'
          +     '<span class="estado-badge ' + (BADGE_CLASS[p.status] || '') + '">' + (BADGE_LABEL[p.status] || p.status) + '</span>'
          +     '<div class="elapsed ' + elapsedClass(p.created_at, p.status) + '" data-ts="' + p.created_at + '" data-status="' + p.status + '">' + formatElapsed(p.created_at) + '</div>'
          +   '</div>'
          + '</div>'
          + '<div class="pedido-items">'
          + items.map(item =>
              '<div class="pedido-item">'
              + '<span class="item-qty">x' + item.quantity + '</span>'
              + '<span class="item-name-cocina">' + esc(item.name) + '</span>'
              + '</div>'
            ).join('')
          + '</div>'
          + (canAct || canUndo
            ? '<div class="pedido-footer">'
              + (canAct ? '<button class="estado-btn ' + p.status + '" data-id="' + p.id + '" onclick="cambiarEstado(this.dataset.id)">' + labelBtn(p.status) + '</button>' : '')
              + (canUndo ? '<button class="card-undo-btn" data-id="' + p.id + '" onclick="deshacerEnCard(this.dataset.id)" title="Deshacer">&#8617;</button>' : '')
              + '</div>'
            : '')
          + '</div>'
      }).join('')

      return '<div class="mesa-group">'
        + '<div class="mesa-group-header">'
        +   '<div class="mesa-group-title">' + mesaLabel + (hayNuevo ? ' <span class="nuevo-badge">NUEVO</span>' : '') + '</div>'
        +   '<div class="mesa-group-meta">'
        +     (nPedidos > 1 ? '<span class="mesa-order-count">' + nPedidos + ' pedidos</span>' : '')
        +     '<span>' + totalItems + ' ítem' + (totalItems !== 1 ? 's' : '') + '</span>'
        +     (hayPreparando ? '<button class="mesa-listo-btn" data-key="' + key + '" onclick="marcarMesaListos(this.dataset.key)">✓ Todo listo</button>' : '')
        +   '</div>'
        + '</div>'
        + cardsHtml
        + '</div>'
    }).join('')

    startElapsedTimer()
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  async function marcarMesaListos(key) {
    const pedidosMesa = Object.values(pedidos).filter(p => {
      const k = p.table_number != null ? String(p.table_number) : 'sin-mesa'
      return k === key && p.status === 'preparing'
    })
    for (const p of pedidosMesa) {
      try {
        const updated = await orders.updateStatus(p.id, 'ready')
        pedidos[p.id] = { ...pedidos[p.id], ...updated }
        historial[p.id] = 'preparing'

        // Notificar al cliente por WhatsApp
        notificarPedidoListo(p.id, restaurantId).catch(() => {})
      } catch {}
    }
    renderAll()
  }

  window.cambiarEstado = cambiarEstado
  window.deshacerEnCard = deshacerEnCard
  window.marcarMesaListos = marcarMesaListos
  window.setFilter = window.setFilter // already set above

  init()
</script>
</body>
</html>
